<!--
=========================================================
GLIP SHARED PRACTICE TEMPLATE

DO NOT EDIT THIS FILE WHEN CREATING A NEW PRACTICE.

Every Practice activity uses this one fixed page. GLIP identifies the
practice from the activity_id in the URL, reads its metadata from Google
Sheets and automatically loads the matching owner-editable content file:

/content/topics/{topic_code}/{activity_code}_content.html

Example:
Activity Code: practice_02
Content file:  /content/topics/text_to_table/practice_02_content.html

Owners create or edit only the *_content.html file.
=========================================================
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="../../assets/GLIP-icon-transparent.png" />

    <script>
      window.PAGE_CONFIG = {
        helpSection: "activity",
        pageKind: "practice",

        get webAppUrl() {
          return typeof window.getGlipWebAppUrl === "function"
            ? window.getGlipWebAppUrl()
            : "";
        },
      };
    </script>

    <script src="https://toniopaceict.github.io/mylearningspace/js/site-loader.js"></script>
  </head>

  <body>
    <div id="header-placeholder"></div>

    <div class="page-shell">
      <header class="page-hero">
        <div class="page-hero-panel">
          <div class="page-hero-divider-top"></div>

          <img
            class="page-hero-brand-icon"
            src="../../assets/GLIP-icon-transparent-cropped.png"
            alt="GLIP logo"
          />

          <div class="page-hero-logo">GLIP</div>

          <p class="page-hero-topline" id="heroTopline"></p>
          <h1 id="heroMainTitle"></h1>
          <h2 id="heroSubTitle"></h2>

          <div class="page-hero-divider-bottom"></div>
        </div>
      </header>

      <div class="top-user-bar">
        <span id="loggedInInfoTop"></span>
        <button id="logoutBtnTop" class="glip-btn" type="button" style="display: none">
          Log out
        </button>
      </div>

      <main class="wrap" id="mainContent">
        <fieldset
          class="download-box no-print readable-section"
          id="practiceInstructionsSection"
          style="display: none"
        >
          <legend>Instructions</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the practice instructions aloud"
          >
            🔊
          </button>

          <div id="practiceInstructionsContent"></div>
        </fieldset>

        <fieldset
          class="download-box no-print readable-section"
          id="requiredFilesSection"
          style="display: none"
        >
          <legend id="requiredFilesLegend">Required Files</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the required file instructions aloud"
          >
            🔊
          </button>

          <div id="requiredFilesInstructionContent">
            <p class="q" data-read>
              Download the required file before starting this practice activity.
            </p>
          </div>

          <div class="download-buttons">
            <a
              class="glip-btn download-btn"
              id="fileLinkBtn1"
              href="#"
              target="glipDownloadFrame"
              style="display: none"
            ></a>

            <a
              class="glip-btn download-btn"
              id="fileLinkBtn2"
              href="#"
              target="glipDownloadFrame"
              style="display: none"
            ></a>

            <a
              class="glip-btn download-btn"
              id="fileLinkBtn3"
              href="#"
              target="glipDownloadFrame"
              style="display: none"
            ></a>

            <iframe
              name="glipDownloadFrame"
              id="glipDownloadFrame"
              title="File download"
              hidden
            ></iframe>
          </div>

          <div
            id="downloadProgressBar"
            class="glip-loading"
            role="progressbar"
            aria-label="Preparing the file download"
          >
            <div class="glip-loading-fill"></div>
          </div>

          <p
            id="downloadMessage"
            class="panel-message text-center hidden"
            role="status"
            aria-live="polite"
          ></p>
        </fieldset>

        <div id="practiceContentContainer" style="display: contents"></div>

        <fieldset class="tracker-box no-print readable-section">
          <legend>Save Progress</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the progress instructions aloud"
          >
            🔊
          </button>

          <p class="q" data-read>
            Select 'Partly Completed' if you intend to return to this practice or
            'Completed' when you have finished it.
          </p>

          <div class="tracker-row">
            <button id="saveInProgressBtn" type="button" class="glip-btn">
              Partly Completed
            </button>

            <button id="saveCompletedBtn" type="button" class="glip-btn">
              Completed
            </button>
          </div>

          <div
            id="saveProgressBar"
            class="glip-loading"
            role="progressbar"
            aria-label="Saving practice progress"
          >
            <div class="glip-loading-fill"></div>
          </div>

          <p
            id="message"
            class="panel-message text-center hidden"
            role="status"
            aria-live="polite"
          ></p>
        </fieldset>
      </main>

      <div class="site-footer" id="siteFooter"></div>
    </div>

    <script>
      /*
       * Optional owner-editable practice introduction.
       *
       * In a *_content.html file, add:
       *
       * <section data-practice-content="instructions">
       *   <p>Your instruction sentence here.</p>
       * </section>
       *
       * When the shared practice content is loaded, this script moves that
       * content into the Instructions fieldset above Required File.
       */
      (function () {
        const container = document.getElementById("practiceContentContainer");
        const instructionsSection = document.getElementById(
          "practiceInstructionsSection"
        );
        const instructionsContent = document.getElementById(
          "practiceInstructionsContent"
        );

        if (!container || !instructionsSection || !instructionsContent) {
          return;
        }

        function loadPracticeInstructions() {
          const source = container.querySelector(
            '[data-practice-content="instructions"]'
          );

          if (!source) {
            instructionsContent.innerHTML = "";
            instructionsSection.style.display = "none";
            return false;
          }

          instructionsContent.innerHTML = source.innerHTML;

          instructionsContent
            .querySelectorAll("p, li, td, th")
            .forEach((element) => {
              if (!element.hasAttribute("data-read")) {
                element.setAttribute("data-read", "");
              }
            });

          source.remove();
          instructionsSection.style.display = "";
          return true;
        }

        if (!loadPracticeInstructions()) {
          const observer = new MutationObserver(function () {
            if (loadPracticeInstructions()) {
              observer.disconnect();
            }
          });

          observer.observe(container, {
            childList: true,
            subtree: true,
          });
        }
      })();
    </script>

  </body>
</html>
