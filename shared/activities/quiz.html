<!--
=========================================================
GLIP SHARED QUIZ TEMPLATE

DO NOT EDIT THIS FILE WHEN CREATING A NEW QUIZ.

Every Quiz uses this one fixed page. GLIP identifies its activity_id from
the URL, reads metadata from Google Sheets and loads:

/content/topics/{topic_code}/{activity_code}_content.html

Owners create or edit only the *_content.html file.
=========================================================
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../../assets/GLIP-icon-transparent.png" />

    <script>
      window.PAGE_CONFIG = {
        helpSection: "activity",
        pageKind: "quiz",

        get webAppUrl() {
          return typeof window.getGlipWebAppUrl === "function"
            ? window.getGlipWebAppUrl()
            : "";
        }
      };
    </script>

    <script src="../../js/site-loader.js"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <div class="page-shell">
      <!--
      =====================================================
      SECTION 1: QUIZ HERO

      Displays the subject, topic and activity title.
      Values are inserted automatically from Google Sheets.
      =====================================================
      -->
      <header class="page-hero">
        <div class="page-hero-panel">
          <div class="page-hero-divider-top"></div>

          <img
            class="page-hero-brand-icon"
            src="../../assets/GLIP-icon-transparent-cropped.png"
            alt="GLIP logo"
          />

          <div class="page-hero-logo">GLIP</div>

          <p class="page-hero-topline" id="heroTopline"></p>
          <h1 id="heroMainTitle"></h1>
          <h2 id="heroSubTitle"></h2>

          <div class="page-hero-divider-bottom"></div>
        </div>
      </header>

      <div class="top-user-bar">
        <span id="loggedInInfoTop"></span>
        <button id="logoutBtnTop" class="glip-btn" type="button" style="display: none">
          Log out
        </button>
      </div>

      <main class="wrap" id="mainContent">
        <div class="top-actions no-print">
          <button type="button" class="glip-btn" id="resetBtnTop">
            Reset Quiz
          </button>
        </div>

        <!--
        ===================================================
        SECTION 2: REQUIRED FILES

        EDIT THE FILE LINKS AND BUTTON TEXT IN QUIZ_CONFIG.

        The complete fieldset is hidden automatically when
        no required file has been configured.
        ===================================================
        -->
        <fieldset
          class="download-box no-print readable-section"
          id="requiredFilesSection"
        >
          <legend id="requiredFilesLegend">Required Files</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the required file instructions aloud"
          >
            🔊
          </button>

          <p class="q" data-read>
            Download the required file before starting this quiz.
          </p>

          <div class="download-buttons">
            <a class="glip-btn download-btn" id="fileLinkBtn1" href="#" target="glipDownloadFrame" style="display: none"></a>
            <a class="glip-btn download-btn" id="fileLinkBtn2" href="#" target="glipDownloadFrame" style="display: none"></a>
            <a class="glip-btn download-btn" id="fileLinkBtn3" href="#" target="glipDownloadFrame" style="display: none"></a>

            <iframe
              name="glipDownloadFrame"
              id="glipDownloadFrame"
              title="File download"
              hidden
            ></iframe>
          </div>

          <div
            id="downloadProgressBar"
            class="glip-loading"
            role="progressbar"
            aria-label="Preparing the file download"
          >
            <div class="glip-loading-fill"></div>
          </div>

          <p
            id="downloadMessage"
            class="panel-message text-center hidden"
            role="status"
            aria-live="polite"
          ></p>
        </fieldset>

        <fieldset class="task-box readable-section">
          <legend>Instructions</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the quiz instructions aloud"
          >
            🔊
          </button>

          <p class="q no-print" id="instructionsText" data-read></p>
        </fieldset>

        <form id="quiz" novalidate>
          <div id="quizContainer"></div>
        </form>

        <fieldset class="tracker-box no-print readable-section">
          <legend>Save as PDF</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the PDF instructions aloud"
          >
            🔊
          </button>

          <p class="q" id="pdfBoxTitle" data-read></p>

          <div class="tracker-row">
            <p class="tracker-score" id="scoreBox" aria-live="polite">
              Score: 0 / 0
            </p>

            <button type="button" class="glip-btn" id="savePdfBtn"></button>
          </div>

          <p
            id="pdfMessage"
            class="panel-message text-center hidden"
            role="status"
            aria-live="polite"
          ></p>
        </fieldset>

        <fieldset class="tracker-box no-print readable-section">
          <legend>Submit</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the submission instructions aloud"
          >
            🔊
          </button>

          <p class="q" data-read>
            Submit your quiz results to your teacher and mark this quiz as complete.
          </p>

          <div class="tracker-row">
            <button id="submitQuizResultBtn" type="button" class="glip-btn">
              Submit and Mark as Complete
            </button>
          </div>

          <p id="quizIncompleteNote" class="q text-center" hidden>
            Submitted by mistake? Click “Mark as Incomplete” above.
          </p>

          <div
            id="saveProgressBar"
            class="glip-loading"
            role="progressbar"
            aria-label="Saving quiz result"
          >
            <div class="glip-loading-fill"></div>
          </div>

          <p
            id="message"
            class="panel-message text-center hidden"
            role="status"
            aria-live="polite"
          ></p>
        </fieldset>
      </main>

      <div class="site-footer" id="siteFooter"></div>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <div id="lightboxBox" class="lightbox-box">
        <div id="lightboxHeader" class="lightbox-header">
          <span class="lightbox-title">Image Preview</span>
          <button type="button" class="lightbox-close" aria-label="Close">
            ×
          </button>
        </div>

        <div class="lightbox-body">
          <img
            class="lightbox-img"
            id="lightboxImg"
            alt="Expanded question image"
          />
        </div>
      </div>
    </div>

    <script>
      /*
      =====================================================
      QUIZ RESULT SUBMISSION

      The activity metadata is resolved automatically by
      topic-page-context.js before this handler is used.
      =====================================================
      */
      (function () {
        function getQuizAnswer(questionId) {
          const selected = document.querySelector(
            `input[name="${questionId}"]:checked`
          );

          return selected ? selected.value : "";
        }

        function calculateQuizResult() {
          const questions = window.QUESTIONS || [];

          let score = 0;
          let totalMarks = 0;

          const answers = questions.map(function (question) {
            const selectedAnswer = getQuizAnswer(question.id);
            const marks = Number(question.marks || 1);
            const isCorrect = selectedAnswer === question.correct;

            totalMarks += marks;

            if (isCorrect) {
              score += marks;
            }

            const selectedOption = (question.options || []).find(function (option) {
              return option.value === selectedAnswer;
            }) || {};
            const correctOption = (question.options || []).find(function (option) {
              return option.value === question.correct;
            }) || {};

            return {
              question_id: question.id,
              question_title: question.title,
              question_text: question.text || "",
              selected_answer: selectedAnswer,
              selected_label: selectedOption.label || selectedAnswer,
              correct_answer: question.correct,
              correct_label: correctOption.label || question.correct,
              marks: marks,
              awarded_marks: isCorrect ? marks : 0,
              is_correct: isCorrect,
            };
          });

          const percentage =
            totalMarks > 0 ? Math.round((score / totalMarks) * 100) : 0;

          return {
            score: score,
            totalMarks: totalMarks,
            percentage: percentage,
            answers: answers,
          };
        }

        function allQuizQuestionsAnswered(result) {
          return result.answers.every(function (answer) {
            return answer.selected_answer;
          });
        }

        function isQuizActivityCompleted() {
          const config = window.PAGE_CONFIG || {};
          const activityId = String(config.activityId || "").trim();
          if (!activityId) return false;
          try {
            const session = JSON.parse(sessionStorage.getItem("glipLearningSession") || "null");
            if (!session || !Array.isArray(session.curricula)) return false;
            return session.curricula.some(function (curriculum) {
              return (Array.isArray(curriculum.progress) ? curriculum.progress : []).some(function (row) {
                if (String(row.activity_id || row.activityId || "").trim() !== activityId) return false;
                const status = String(row.status || "").trim().toLowerCase();
                return status === "2" || status === "complete" || status === "completed";
              });
            });
          } catch (_error) {
            return false;
          }
        }

        function setQuizCompletionState(isComplete) {
          const button = document.getElementById("submitQuizResultBtn");
          const note = document.getElementById("quizIncompleteNote");
          if (button) {
            button.dataset.completionMode = isComplete ? "incomplete" : "submit";
            if (!button.disabled) {
              button.textContent = isComplete ? "Mark as Incomplete" : "Submit and Mark as Complete";
            }
          }
          if (note) note.hidden = !isComplete;
        }

        function setQuizSavingState(isSaving) {
          const button = document.getElementById("submitQuizResultBtn");
          const progressBar = document.getElementById("saveProgressBar");

          if (button) {
            button.disabled = isSaving;
            button.textContent = isSaving
              ? (button.dataset.completionMode === "incomplete" ? "Updating..." : "Saving...")
              : (button.dataset.completionMode === "incomplete" ? "Mark as Incomplete" : "Submit and Mark as Complete");
          }

          if (progressBar) {
            progressBar.classList.toggle("show", isSaving);
          }
        }

        function setMessage(text, type) {
          const message = document.getElementById("message");
          if (!message) return;

          const value = text || "";
          message.textContent = value;
          message.className =
            "panel-message text-center" + (type ? " " + type : "") + (value ? "" : " hidden");
        }

        function updateMenuIconAfterQuizSubmit() {
          const config = window.PAGE_CONFIG || {};

          window.dispatchEvent(
            new CustomEvent("glipProgressSaved", {
              detail: {
                activityId: config.activityId,
                status: "completed",
                subjectId: config.subjectId,
                level: config.level,
                topicId: config.topicId,
              },
            })
          );
        }

        function submitQuizResult() {
          const config = window.PAGE_CONFIG || {};
          const result = calculateQuizResult();

          if (!allQuizQuestionsAnswered(result)) {
            setMessage(
              "Please answer all quiz questions before submitting.",
              "error"
            );
            return;
          }

          const studentId = sessionStorage.getItem("glipStudentId") || "";

          if (!studentId) {
            setMessage("Student not logged in.", "error");
            return;
          }

          const webAppUrl =
            typeof window.getGlipWebAppUrl === "function"
              ? window.getGlipWebAppUrl()
              : config.webAppUrl || "";

          if (!webAppUrl) {
            setMessage("GLIP could not connect to the server.", "error");
            return;
          }

          setQuizSavingState(true);
          setMessage("Saving quiz result...", "info");

          fetch(webAppUrl, {
            method: "POST",
            body: JSON.stringify({
              action: "saveQuizResultAndProgress",

              student_id: studentId,
              student_name: sessionStorage.getItem("glipStudentName") || "",
              class_id: sessionStorage.getItem("glipClassId") || "",

              level: config.level,
              subject_id: config.subjectId,
              topic_id: config.topicId,
              topic_name: config.topicName,
              activity_id: config.activityId,
              quiz_title:
                config.subTitle ||
                config.pdfFallbackName ||
                "Quiz",

              score: result.score,
              total_marks: result.totalMarks,
              percentage: result.percentage,
              answers_json: JSON.stringify(result.answers),
            }),
          })
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              if (data.status !== "success") {
                throw new Error(data.message || "Could not save quiz result.");
              }

              updateMenuIconAfterQuizSubmit();
              setQuizCompletionState(true);

              setMessage(
                data.message || "Your quiz has been submitted and marked as complete.",
                "success"
              );
            })
            .catch(function (error) {
              setMessage(
                error.message || "Could not save quiz result.",
                "error"
              );
            })
            .finally(function () {
              setQuizSavingState(false);
            });
        }

        function markQuizIncomplete() {
          const config = window.PAGE_CONFIG || {};
          const studentId = sessionStorage.getItem("glipStudentId") || "";
          const classId = sessionStorage.getItem("glipClassId") || "";
          const webAppUrl = typeof window.getGlipWebAppUrl === "function"
            ? window.getGlipWebAppUrl()
            : config.webAppUrl || "";

          if (!studentId) { setMessage("Student not logged in.", "error"); return; }
          if (!webAppUrl) { setMessage("GLIP could not connect to the server.", "error"); return; }

          setQuizSavingState(true);
          setMessage("Marking the activity as incomplete...", "info");

          fetch(webAppUrl, {
            method: "POST",
            body: JSON.stringify({
              action: "setStudentProgressAsIncomplete",
              student_id: studentId, class_id: classId,
              subject_id: config.subjectId, level: config.level, activity_id: config.activityId
            })
          })
            .then(function (response) { return response.json(); })
            .then(function (data) {
              if (data.status !== "success") throw new Error(data.message || "Could not update progress.");
              if (window.GLIPProgressEngine) {
                window.GLIPProgressEngine.updateProgress({
                  subject_id: config.subjectId, level: config.level, topic_id: config.topicId,
                  activity_id: config.activityId, status: "not_started"
                });
              }
              window.dispatchEvent(new CustomEvent("glipProgressSaved", { detail: {
                subjectId: config.subjectId, level: config.level, topicId: config.topicId,
                activityId: config.activityId, status: "not_started"
              }}));
              setQuizCompletionState(false);
              setMessage("Activity marked as incomplete.", "success");
            })
            .catch(function (error) { setMessage(error.message || "Could not update progress.", "error"); })
            .finally(function () { setQuizSavingState(false); });
        }

        function handleQuizCompletionClick() {
          const button = document.getElementById("submitQuizResultBtn");
          if (button && button.dataset.completionMode === "incomplete") markQuizIncomplete();
          else submitQuizResult();
        }

        function initialiseQuizSubmission() {
          const button = document.getElementById("submitQuizResultBtn");

          setQuizCompletionState(isQuizActivityCompleted());

          if (button && !button.dataset.quizSubmitReady) {
            button.dataset.quizSubmitReady = "true";
            button.addEventListener("click", handleQuizCompletionClick);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener(
            "DOMContentLoaded",
            initialiseQuizSubmission
          );
        } else {
          initialiseQuizSubmission();
        }

        document.addEventListener(
          "glipReady",
          initialiseQuizSubmission
        );
      })();
    </script>
  </body>
</html>
