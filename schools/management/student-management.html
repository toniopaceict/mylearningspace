<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="../../assets/GLIP-icon-transparent.png" />

    <title>GLIP – Student Management</title>

    <script>
      window.PAGE_CONFIG = {
        pageKind: "management",
        pageTitle: "GLIP – Student Management"
      };

      window.PAGE_MENU_CONTEXT = {
        type: "management"
      };
    </script>
    <script src="https://toniopaceict.github.io/mylearningspace/js/site-loader.js"></script>
</head>

  <body>
    <div id="header-placeholder"></div>

    <div class="page-shell">
      <header class="page-hero">
        <div class="page-hero-panel">
          <div class="page-hero-divider-top"></div>

          <img
            class="page-hero-brand-icon"
            src="../../assets/GLIP-icon-transparent-cropped.png"
            alt="GLIP logo"
          />

          <div class="page-hero-logo">GLIP</div>

          <p class="page-hero-topline">
            Guided Learning for Independent Progress
          </p>

          <h1>Student Management</h1>
          <h2>Admin Area</h2>

          <div class="page-hero-divider-bottom"></div>
        </div>
      </header>

      <div class="wrap management-wrap">
        <fieldset class="task-box panel-box topics-box" id="addStudentPanel">
          <legend>Add Student</legend>

          <p class="q">
            Enter the student details below.
          </p>

          

          <div class="tracker-row">
            <input
              type="text"
              id="newStudentName"
              class="tracker-input"
              placeholder="Name"
            />

            <input
              type="text"
              id="newStudentSurname"
              class="tracker-input"
              placeholder="Surname"
            />

            <input
              type="text"
              id="newStudentCode"
              class="tracker-input"
              placeholder="Login code"
            />

            <input
              type="email"
              id="newStudentEmail"
              class="tracker-input"
              placeholder="Email"
            />
            
            <select id="newStudentLevel" class="tracker-input">
              <option value="">Loading levels...</option>
            </select>
            
            <select id="newStudentClassId" class="tracker-input">
              <option value="">Select class</option>
            </select>
          </div>

          <div class="tracker-row">
            <label class="form-check">
              <input
                type="checkbox"
                id="sendStudentCodeOnCreate"
                checked
              />
              Send code by email after creating student
            </label>
          </div>

          <div class="tracker-row">
            <button
              type="button"
              class="glip-btn"
              id="saveStudentBtn"
            >
              Save Student
            </button>
          </div>


          <p
            id="addStudentMessage"
            class="panel-message text-center"
          ></p>

<div
              id="studentsLoadingProgress"
              class="page-loading-box text-center"
              style="display: none"
            >
              <div class="glip-progress show topics-progress">
                <div class="glip-progress-bar"></div>
              </div>
              <p>Loading students...</p>
            </div>


        <div
          id="saveStudentProgress"
          class="page-loading-box"
          style="display: none"
        >
          <div class="glip-progress show topics-progress">
            <div class="glip-progress-bar"></div>
          </div>
        </div>
        </fieldset>

        <fieldset class="task-box panel-box topics-box">
          <legend>Student Management</legend>

          

          <div class="panel-header">
            <p class="q panel-top-text">
              View students, classes and account status.
            </p>

            <div class="panel-right teacher-actions">
              <button
                type="button"
                class="glip-btn"
                id="sendSelectedStudentCodesBtn"
              >
                Send selected codes
              </button>

              <button
                type="button"
                class="glip-btn"
                id="editStudentsBtn"
              >
                Edit Students
              </button>
            </div>
          </div>

          <p
            id="studentManagementMessage"
            class="panel-message teacher-message"
          ></p>

          <div
            id="saveStudentsProgress"
            class="page-loading-box text-center"
            style="display: none"
          >
            <div class="glip-progress show topics-progress">
              <div class="glip-progress-bar"></div>
            </div>
            <p>Saving student changes...</p>
          </div>

          <div class="topics-table-wrap" id="studentsTableWrap">
            

            <table
  class="topics-table management-table students-table"
              id="studentsTable"
              style="visibility: hidden"
            >
              
<thead>
  <tr>
    <th data-sort-field="full_name" data-label="Full Name">
      Full Name ↕
    </th>

    <th data-sort-field="code" data-label="Code">
      Code ↕
    </th>

    <th data-sort-field="email" data-label="Email">
      Email ↕
    </th>

    <th data-sort-field="level" data-label="Level">
      Level ↕
    </th>

    <th data-sort-field="class_id" data-label="Class">
      Class ↕
    </th>

    <th data-sort-field="active" data-label="Status">
      Status ↕
    </th>
  </tr>
</thead>


              

              <tbody id="studentsTableBody"></tbody>
            </table>
          </div>
        </fieldset>
      </div>

      <div class="site-footer" id="siteFooter"></div>
    </div>

    <script>
      document.addEventListener("glipReady", function () {
        requireRole("admin", "owner");
      });
    </script></body>
</html>
