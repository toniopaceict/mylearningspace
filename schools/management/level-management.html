<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="../../assets/GLIP-icon-transparent.png" />

    <title>GLIP – Level Management</title>

    <script>
      window.PAGE_CONFIG = {
        helpSection: "level-management",
        pageKind: "management",
        pageTitle: "GLIP – Level Management"
      };

      window.PAGE_MENU_CONTEXT = {
        type: "management"
      };
    </script>

    <script src="https://toniopaceict.github.io/mylearningspace/js/site-loader.js"></script>
  </head>

  <body>
    <div id="header-placeholder"></div>

    <div class="page-shell">
      <header class="page-hero">
        <div class="page-hero-panel">
          <div class="page-hero-divider-top"></div>

          <img
            class="page-hero-brand-icon"
            src="../../assets/GLIP-icon-transparent-cropped.png"
            alt="GLIP logo"
          />

          <div class="page-hero-logo">GLIP</div>

          <p class="page-hero-topline">
            Guided Learning for Independent Progress
          </p>

          <h1>Level Management</h1>
          <h2>Admin Area</h2>

          <div class="page-hero-divider-bottom"></div>
        </div>
      </header>

      <div class="wrap management-wrap">
        <fieldset class="task-box panel-box topics-box" id="addLevelPanel">
          <legend>Add Level</legend>

          <p class="q">
            Add a new level offered by the school.
          </p>

          

          <div class="tracker-row">
            <input
              type="text"
              id="newLevelCode"
              class="tracker-input"
              placeholder="level code"
            />

            <input
              type="text"
              id="newLevelName"
              class="tracker-input"
              placeholder="level name"
            />

            <input
              type="number"
              id="newLevelSortOrder"
              class="tracker-input"
              placeholder="Sort order"
              min="1"
              step="1"
            />

            <select id="newLevelActive" class="tracker-input">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>

          <div class="tracker-row">
            <button
              type="button"
              class="glip-btn"
              id="saveLevelBtn"
            >
              Save Level
            </button>
          </div>

          <div class="page-loading-box text-center" id="saveLevelProgress" style="display: none">
  <div class="glip-progress show topics-progress">
    <div class="glip-progress-bar"></div>
  </div>
  <p>Saving...</p>
</div>

          <p
            id="addLevelMessage"
            class="panel-message text-center"
          ></p>

<div
    id="levelsLoadingProgress"
    class="page-loading-box text-center"
    style="display: none"
  >
    <div class="glip-progress show topics-progress">
      <div class="glip-progress-bar"></div>
    </div>
    <p>Loading levels...</p>
  </div>

        </fieldset>

        <fieldset class="task-box panel-box topics-box">
          <legend>Level Management</legend>

          

          <div class="panel-header">
            <p class="q panel-top-text">
              View levels, display order and status.
            </p>

            <div class="panel-right teacher-actions">
              <button
                type="button"
                class="glip-btn"
                id="editLevelsBtn"
              >
                Edit Levels
              </button>
            </div>
          </div>

          <p
            id="levelManagementMessage"
            class="panel-message teacher-message"
          ></p>

<div class="topics-table-wrap" id="levelsTableWrap">
  

  <table
  class="topics-table management-table levels-table"
    id="levelsTable"
    style="visibility: hidden"
  >
              <thead>
                <tr>
                  <th data-sort-field="level_code" data-label="Level Code">
                    Level Code ↕
                  </th>

                  <th data-sort-field="level_name" data-label="Level Name">
                    Level Name ↕
                  </th>

                  <th data-sort-field="sort_order" data-label="Sort Order">
                    Sort Order ↕
                  </th>

                  <th data-sort-field="active" data-label="Status">
                    Status ↕
                  </th>
                </tr>
              </thead>

              <tbody id="levelsTableBody"></tbody>
            </table>
          </div>
        </fieldset>
      </div>

      <div class="site-footer" id="siteFooter"></div>
    </div>

    <script>
      document.addEventListener("glipReady", function () {
        requireRole("admin", "owner");
      });
    </script>
  </body>
</html>
