        const match = window.location.pathname.match(/\/schools\/([^/]+)\//);

  const sessionLevel = sessionStorage.getItem("glipLevel");

  if (sessionLevel) {
    return "level-" + getLevelNumber(sessionLevel);
  }

  if (window.GLIPTeachingRole) {
    return window.GLIPTeachingRole.getPrimaryLevel();
  }

  return "";
}

   
      function getLevelNumber(level) {
        const match = String(level || "").match(/\d+/);
        return match ? match[0].padStart(2, "0") : "";
      }

<script>
      const SCHOOL = getSchoolFromUrl();
      
      function getWebAppUrl() {

      const LEVEL = getLevelFromUrl();

function isAdminUser() {
  const role = String(sessionStorage.getItem("glipUserType") || "").trim().toLowerCase();
  return role === "owner" || role === "admin";
}  

      
function isTeacherUser() {
  return window.GLIPTeachingRole
    ? window.GLIPTeachingRole.isTeachingRole()
    : false;
}

function setLevelTitle() {
  const levelTitle = document.getElementById("levelTitle");
  if (!levelTitle) return;

  if (isAdminUser()) {
    levelTitle.textContent = "Admin Dashboard";
    return;
  }

  if (isTeacherUser()) {
    levelTitle.textContent = "Teacher Dashboard";
    return;
  }

  levelTitle.textContent = "Level " + Number(getLevelNumber(LEVEL));
}


      
      
      const SUBJECT_CACHE_DURATION = 2 * 60 * 60 * 1000;

      let progressItems = [];
      let topicPreloadStarted = false;

      function glipCacheKey(parts) {
        return window.GLIP_CACHE.makeKey(parts);
      }

      function readTimedLocalCache(key, maxAge) {
        const parsed = window.GLIP_CACHE.readLocal(key, maxAge);
        return Array.isArray(parsed) ? parsed : null;
      }

      function writeTimedLocalCache(key, data) {
        if (!Array.isArray(data)) return;
        window.GLIP_CACHE.writeLocal(key, data);
      }

function getSubjectCache() {
  const userType = sessionStorage.getItem("glipUserType") || "";
  const teacherId = sessionStorage.getItem("glipTeacherId") || "";
  const studentId = sessionStorage.getItem("glipStudentId") || "";

  const keyParts = isStudentLikeUser()
    ? [SCHOOL, userType, teacherId, studentId, "subjects"]
    : [SCHOOL, LEVEL, userType, teacherId, studentId, "subjects"];

  const key = glipCacheKey(keyParts);

  return readTimedLocalCache(key, SUBJECT_CACHE_DURATION);
}


function setSubjectCache(subjects) {
  const userType = sessionStorage.getItem("glipUserType") || "";
  const teacherId = sessionStorage.getItem("glipTeacherId") || "";
  const studentId = sessionStorage.getItem("glipStudentId") || "";

  const keyParts = isStudentLikeUser()
    ? [SCHOOL, userType, teacherId, studentId, "subjects"]
    : [SCHOOL, LEVEL, userType, teacherId, studentId, "subjects"];

  const key = glipCacheKey(keyParts);

  writeTimedLocalCache(key, subjects);
}

 


  


      

      function getCachedProgress() {
        const studentId = sessionStorage.getItem("glipStudentId") || "";
        if (!studentId || !window.GLIP_CACHE) return [];

        return window.GLIP_CACHE.readAllProgress({
          school: SCHOOL,
          studentId: studentId
        }, 30 * 60 * 1000);
      }

      function normaliseStatus(status) {
        return window.GLIPProgressEngine
          ? window.GLIPProgressEngine.normaliseStatus(status)
          : "not_started";
      }

      function getSubjectStatus(subject, progressData) {
        return window.GLIPProgressEngine
          ? window.GLIPProgressEngine.getSubjectStatus(subject, progressData)
          : "not_started";
      }

function getTeacherPermissions() {
  return window.GLIPTeachingRole
    ? window.GLIPTeachingRole.getPermissions({ includeInactive: true })
    : [];
}

function normaliseLevel(level) {
  const match = String(level || "").match(/\d+/);
  return match ? "level-" + match[0].padStart(2, "0") : "";
}

function getLevelLabel(level) {
  return "Level " + Number(getLevelNumber(level));
}

function getSubjectLabel(subjectId, fallbackName) {
  const meta = window.MENU_META && window.MENU_META.subjects;
  const subject = meta && meta[subjectId];

  return subject && subject.label
    ? subject.label
    : fallbackName || subjectId;
}

function getAssignedClassIds(level, subjectId) {
  const permissions = getTeacherPermissions();

  const classIds = permissions
    .filter(function (permission) {
      return (
        normaliseLevel(permission.level) === normaliseLevel(level) &&
        String(permission.subject_id || "").trim() === subjectId &&
        permission.active !== false &&
        String(permission.active).toLowerCase() !== "false"
      );
    })
    .map(function (permission) {
      return String(permission.class_id || "").trim();
    })
    .filter(Boolean);

  return Array.from(new Set(classIds));
}

function storeTeacherSubjectContext(level, subjectId, levelId, curriculumId) {
  const classIds = getAssignedClassIds(level, subjectId);

  sessionStorage.setItem("glipLevel", level || "");
  sessionStorage.setItem("glipSubjectId", subjectId);

  if (levelId) {
    sessionStorage.setItem("glipLevelId", String(levelId));
  } else {
    sessionStorage.removeItem("glipLevelId");
  }

  if (curriculumId) {
    sessionStorage.setItem("glipCurriculumId", String(curriculumId));
  } else {
    sessionStorage.removeItem("glipCurriculumId");
  }
  sessionStorage.setItem("glipClassIds", JSON.stringify(classIds));

  if (classIds.length > 0) {
    sessionStorage.setItem("glipClassId", classIds[0]);
  } else {
    sessionStorage.removeItem("glipClassId");
  }
}

function getSubjectHomeLink(level, subjectId) {
  return "topics-home.html";
}
      
      function getSubjectBadgeHtml(status) {
        return window.GLIPProgressEngine
          ? window.GLIPProgressEngine.badgeHtml(status)
          : `<span class="topic-badge not-started" title="Not started"></span>`;
      }

function isStudentUser() {
  const role = sessionStorage.getItem("glipRole") || "";
  const userType = sessionStorage.getItem("glipUserType") || "";
  return role === "student" || userType === "student";
}

function isSupportUser() {
  if (window.GLIPTeachingRole && typeof window.GLIPTeachingRole.isSupportOnly === "function") {
    return window.GLIPTeachingRole.isSupportOnly();
  }

  return String(sessionStorage.getItem("glipSupportOnly") || "").toLowerCase() === "true";
}

function isStudentLikeUser() {
  return isStudentUser() || isSupportUser();
}

function getAcademicYearFromClassId(classId) {
  const cleanClassId = String(classId || "").trim();
  const match = cleanClassId.match(/-(\d{2})$/);

  if (!match) {
    return "";
  }

  const startYear = 2000 + Number(match[1]);
  const endYearShort = String((startYear + 1) % 100).padStart(2, "0");

  return startYear + "-" + endYearShort;
}

function getClassYearLabel(classId) {
  const academicYear = getAcademicYearFromClassId(classId);

  if (academicYear) {
    return academicYear;
  }

  return String(classId || "").trim() || "Current Subjects";
}

function getDisplayClassIdForSubjectYear(subject) {
  const classId = String(subject.class_id || "").trim();
  const accessType = String(subject.access_type || "current").trim().toLowerCase();

  if (accessType !== "revision") {
    return classId;
  }

  const yearMatch = classId.match(/-(\d{2})$/);
  const currentLevelMatch = classId.match(/^(\d+)/);
  const subjectLevelMatch = String(subject.level || "").match(/level-(\d+)/);

  if (!yearMatch || !currentLevelMatch || !subjectLevelMatch) {
    return classId;
  }

  const currentYear = Number(yearMatch[1]);
  const currentLevel = Number(currentLevelMatch[1]);
  const subjectLevel = Number(subjectLevelMatch[1]);

  const yearDifference = Math.max(1, currentLevel - subjectLevel);
  const displayYear = String(currentYear - yearDifference).padStart(2, "0");

  return classId.replace(/-\d{2}$/, "-" + displayYear);
}

  function getYearClassIdForGrouping(subject) {
  if (isAdminUser()) {
    return String(subject.class_id || "").trim();
  }

  return getDisplayClassIdForSubjectYear(subject);
}

function getSubjectYearGroupKey(subject) {
  const classId = getYearClassIdForGrouping(subject);
  const match = classId.match(/-(\d{2})$/);

  return match ? match[1] : "current";
}

function getSubjectYearGroupLabel(subjectsInGroup) {
  const first = subjectsInGroup[0] || {};
  return getClassYearLabel(getYearClassIdForGrouping(first));
}

function getSubjectYearGroupSortValue(subjectsInGroup) {
  const first = subjectsInGroup[0] || {};
  const classId = getYearClassIdForGrouping(first);
  const match = classId.match(/-(\d{2})$/);

  return match ? Number(match[1]) : 0;
}


function removeDuplicateSubjectCards(subjects) {
  const seen = new Set();

  return subjects.filter(function (subject) {
    const key =
      String(subject.level || "").trim() +
      "|" +
      String(subject.subject_id || "").trim();

    if (seen.has(key)) return false;

    seen.add(key);
    return true;
  });
}

function groupSubjectsByLevel(subjects) {
  const grouped = {};

  subjects.forEach(function (subject) {
    const level = normaliseLevel(subject.level || LEVEL);

    if (!level) return;

    if (!grouped[level]) {
      grouped[level] = [];
    }

    grouped[level].push(subject);
  });

  return Object.keys(grouped)
    .sort()
    .map(function (level) {
      return {
        level: level,
        subjects: grouped[level]
      };
    });
}
  
function getStudentSubjectGroupKey(subject) {
  const classId = String(subject.class_id || "").trim();
  const accessType = String(subject.access_type || "current").trim().toLowerCase();
  return (classId || "current") + "|" + accessType;
}

function getStudentSubjectGroupLabel(subjectsInGroup) {
  const first = subjectsInGroup[0] || {};
  const accessType = String(first.access_type || "current").trim().toLowerCase();

  if (accessType === "repeat") return "Repeat";
  if (accessType === "revision") return "Revision";
  return "Current";
}

function getStudentSubjectGroupSortValue(subjectsInGroup) {
  const first = subjectsInGroup[0] || {};
  const classId = String(first.class_id || "").trim();
  const match = classId.match(/-(\d{2})$/);
  const accessType = String(first.access_type || "current").trim().toLowerCase();
  const year = match ? Number(match[1]) : 0;
  const currentBonus = accessType === "current" ? 1000 : 0;

  return currentBonus + year;
}

function renderSubjectCards(subjects, fallbackLevel) {
  return subjects
    .map(function (subject) {
      const isAvailable = subject.visible === true;
      const subjectStatus = getSubjectStatus(subject, progressItems);

      const subjectId = String(subject.subject_id || "").trim();
      const subjectCode = String(subject.subject_code || "").trim();
      const subjectName = String(subject.subject_name || "").trim();
      const subjectLevel = String(subject.level || fallbackLevel || LEVEL || "").trim();
      const levelId = String(subject.level_id || "").trim();
      const curriculumId = String(subject.curriculum_id || "").trim();

      const link = getSubjectHomeLink(subjectLevel, subjectId);

      const image =
        "../../content/subjects/" +
        subjectCode +
        ".jpg";

      return `
        <a href="${isAvailable ? link : "#"}"
           class="topic-card ${isAvailable ? "" : "unavailable"}"
           data-subject-id="${subjectId}"
           data-level="${subjectLevel}"
           data-level-id="${levelId}"
           data-curriculum-id="${curriculumId}">

          <div class="topic-card-img-wrap">
            ${isAvailable ? getSubjectBadgeHtml(subjectStatus) : ""}

            <img
              src="${image}"
              alt="${subjectName}"
              loading="lazy"
              decoding="async"
              onerror="this.onerror=null; this.src='../../assets/studentslearning.jpg';"
            >
          </div>

          <div class="topic-card-caption">
            ${subjectName}
          </div>

        </a>
      `;
    })
    .join("");
}

function renderSubjectsByLevelThenYear(subjects) {
  const levelGroups = groupSubjectsByLevel(subjects);

  return levelGroups
    .sort(function (a, b) {
      return Number(getLevelNumber(b.level)) - Number(getLevelNumber(a.level));
    })
    .map(function (levelGroup) {
      const yearGroups = {};

      levelGroup.subjects.forEach(function (subject) {
        const key = getSubjectYearGroupKey(subject);
        if (!yearGroups[key]) yearGroups[key] = [];
        yearGroups[key].push(subject);
      });

      const innerGroups = Object.keys(yearGroups)
        .map(function (key) {
          return {
            subjects: removeDuplicateSubjectCards(yearGroups[key]),
            sortValue: getSubjectYearGroupSortValue(yearGroups[key])
          };
        })
        .sort(function (a, b) {
          return b.sortValue - a.sortValue;
        });

      return `
        <fieldset class="task-box subjects-box teacher-level-group">
          <legend>${getLevelLabel(levelGroup.level)}</legend>
          ${innerGroups.map(function (group) {
            return `
              <fieldset class="task-box subjects-box teacher-level-group">
                <legend>${getSubjectYearGroupLabel(group.subjects)}</legend>
                <div class="topic-grid">
                  ${renderSubjectCards(group.subjects, levelGroup.level)}
                </div>
              </fieldset>
            `;
          }).join("")}
        </fieldset>
      `;
    })
    .join("");
}

function renderStudentSubjectsByClass(subjects) {
  const container = document.getElementById("topic-grid");
  const levelGroups = groupSubjectsByLevel(subjects);

  container.style.display = "block";
  container.innerHTML = levelGroups
    .sort(function (a, b) {
      return Number(getLevelNumber(b.level)) - Number(getLevelNumber(a.level));
    })
    .map(function (levelGroup) {
      const assignmentGroups = {};

      levelGroup.subjects.forEach(function (subject) {
        const key = getStudentSubjectGroupKey(subject);
        if (!assignmentGroups[key]) assignmentGroups[key] = [];
        assignmentGroups[key].push(subject);
      });

      const innerGroups = Object.keys(assignmentGroups)
        .map(function (key) {
          return {
            subjects: removeDuplicateSubjectCards(assignmentGroups[key]),
            sortValue: getStudentSubjectGroupSortValue(assignmentGroups[key])
          };
        })
        .sort(function (a, b) { return b.sortValue - a.sortValue; });

      return `
        <fieldset class="task-box subjects-box teacher-level-group">
          <legend>${getLevelLabel(levelGroup.level)}</legend>
          ${innerGroups.map(function (group) {
            return `
              <fieldset class="task-box subjects-box teacher-level-group">
                <legend>${getStudentSubjectGroupLabel(group.subjects)}</legend>
                <div class="topic-grid">
                  ${renderSubjectCards(group.subjects, levelGroup.level)}
                </div>
              </fieldset>
            `;
          }).join("")}
        </fieldset>
      `;
    })
    .join("");
}

  

function renderSubjects(subjects) {
  const container = document.getElementById("topic-grid");
  const teacherDashboard = document.getElementById("teacher-dashboard");

  const loadingProgress = document.getElementById("subjectsLoadingProgress");
if (loadingProgress) loadingProgress.style.display = "none";

  if (teacherDashboard) {
    teacherDashboard.style.display = "none";
  }

  container.style.display = "";

if (!Array.isArray(subjects) || subjects.length === 0) {
  const intro = document.getElementById("subjectsIntro");
  if (intro) intro.style.display = "none";

  container.style.display = "block";

  container.innerHTML = `
    <p class="q">
      No subjects have been assigned to your account. Please contact your teacher if you believe this is incorrect.
    </p>
  `;
  return;
}

  progressItems = getCachedProgress();

const intro = document.getElementById("subjectsIntro");
if (intro) intro.style.display = "";

  if (isStudentLikeUser()) {
    renderStudentSubjectsByClass(subjects);
    return;
  }
  
  container.style.display = "grid";
  container.innerHTML = renderSubjectCards(subjects, LEVEL);
}

function groupTeacherSubjectsByLevel(assignmentsByLevel) {
  const grouped = {};

  Object.keys(assignmentsByLevel).forEach(function (level) {
    const subjects = assignmentsByLevel[level] || [];

    subjects.forEach(function (subject) {
      const subjectId = String(subject.subject_id || "").trim();

      if (!subjectId) return;

      if (!grouped[level]) {
        grouped[level] = {};
      }

      if (!grouped[level][subjectId]) {
        grouped[level][subjectId] = subject;
      }
    });
  });

  return grouped;
}

function renderTeacherDashboard(assignmentsByLevel) {
  const dashboard = document.getElementById("teacher-dashboard");
  const normalGrid = document.getElementById("topic-grid");
const loadingProgress = document.getElementById("subjectsLoadingProgress");
if (loadingProgress) loadingProgress.style.display = "none";
  if (!dashboard || !normalGrid) return;

  const allSubjects = [];

  Object.keys(assignmentsByLevel).forEach(function (level) {
    const subjects = assignmentsByLevel[level] || [];
    subjects.forEach(function (subject) {
      allSubjects.push(subject);
    });
  });

  normalGrid.style.display = "none";
  dashboard.style.display = "";

  if (!allSubjects.length) {
    dashboard.innerHTML = `
      <p class="q">
        No subjects have been assigned to your account. Please contact your administrator if you believe this is incorrect.
      </p>
    `;
    return;
  }

  dashboard.innerHTML = renderSubjectsByLevelThenYear(allSubjects);
}

  

      

      async function fetchSubjects() {
        let learningSessionFallback = null;

        try {

          if (
            isStudentUser() &&
            window.GLIPLearningSession &&
            typeof window.GLIPLearningSession.hasValidSession === "function" &&
            window.GLIPLearningSession.hasValidSession()
          ) {
            const sessionSubjects = window.GLIPLearningSession.getSubjects();
            if (Array.isArray(sessionSubjects)) {
              learningSessionFallback = sessionSubjects;
            }
          }

          // StudentSubjects can be changed by an administrator while a learner
          // still has an older Learning Session in this browser. Always verify
          // learner assignment visibility with Apps Script before settling the
          // page; the Learning Session remains a safe fallback if the request
          // itself fails.
          if (isStudentUser()) {
            console.info("Verifying student subject assignments with Apps Script.");
          }

const payload = {
  action: "getSubjects",
  userType: sessionStorage.getItem("glipUserType") || "",
  teacher_id: sessionStorage.getItem("glipTeacherId") || "",
  student_id: sessionStorage.getItem("glipStudentId") || "",
};

if (!isStudentLikeUser()) {
  payload.level = LEVEL;
}

const res = await fetch(getWebAppUrl(), {
  method: "POST",
  body: JSON.stringify(payload),
});
          


          

          const data = await res.json();

          if (data.status !== "success") {
            throw new Error(data.message || "Error loading subjects");
          }

          const subjects = Array.isArray(data.subjects) ? data.subjects : [];
          
          setSubjectCache(subjects);
          return subjects;
        } catch (err) {
          console.error(err);
          if (Array.isArray(learningSessionFallback)) {
            return learningSessionFallback;
          }
          return null;
        }
      }

      async function fetchProgressForSubjects(subjects) {
        const studentId = sessionStorage.getItem("glipStudentId") || "";

        if (!studentId || !Array.isArray(subjects)) return [];

        if (isStudentUser() && window.GLIPLearningSession) {
          const sessionProgress = window.GLIPLearningSession.getAllProgress();
          if (Array.isArray(sessionProgress)) {
            progressItems = sessionProgress;
            window.GLIP_CACHE.writeAllProgress({ school: SCHOOL, studentId: studentId }, sessionProgress);
            renderSubjects(subjects);
            return sessionProgress;
          }
        }

        const visibleSubjects = subjects.filter(function (subject) {
          return subject.visible === true;
        });

        const allProgress = [];

        await Promise.all(
          visibleSubjects.map(async function (subject) {
            const subjectId = String(subject.subject_id || "").trim();
            if (!subjectId) return;

            try {
              const res = await fetch(getWebAppUrl(), {
                method: "POST",
                body: JSON.stringify({
                  action: "getMyProgress",
                  student_id: studentId,
                  subject_id: subjectId,
                  level: normaliseLevel(subject.level || LEVEL),
                }),
              });

              const data = await res.json();

              if (data.status === "success" && Array.isArray(data.progress)) {
                const subjectProgress = data.progress.map(function (item) {
                  return {
                    subject_id: subjectId,
                    topic_id: String(item.topic_id || "").trim(),
                    level: normaliseLevel(item.level || subject.level || LEVEL),
                    activity_id: item.activity_id,
                    status: item.status || "not_started",
                  };
                });

                window.GLIP_CACHE.writeProgress({
                  school: SCHOOL,
                  level: subject.level || LEVEL,
                  studentId: studentId,
                  subjectId: subjectId
                }, subjectProgress);

                allProgress.push(...subjectProgress);
              }
            } catch (err) {
              console.warn("Could not fetch progress for " + subjectId, err);
            }
          }),
        );

        if (allProgress.length > 0) {
          window.GLIP_CACHE.writeAllProgress({
            school: SCHOOL,
            studentId: studentId
          }, allProgress);

          renderSubjects(subjects);
        }

        return allProgress;
      }

      function postToGlip(data) {
        return fetch(getWebAppUrl(), {
          method: "POST",
          body: JSON.stringify(data),
        }).then(function (res) {
          return res.json();
        });
      }

      function preloadImage(src) {
        return new Promise(function (resolve) {
          const img = new Image();

          img.onload = function () {
            resolve(true);
          };

          img.onerror = function () {
            resolve(false);
          };

          img.src = src;
        });
      }

      function getTopicImageFromSubjectPage(subjectCode, topic) {
        const topicFolder = String(topic.topic_code || topic.topic_id || "").trim();

        if (!topicFolder) return "";

        return (
          "../../content/topics/" +
          topicFolder +
          "/" +
          topicFolder +
          ".jpg"
        );
      }

      async function preloadTopicsForSubject(subject) {
        subject = subject || {};

        const subjectId = String(subject.subject_id || "").trim();
        const subjectCode = String(subject.subject_code || "").trim();
        const subjectLevel = String(subject.level || LEVEL || "").trim();
        const levelId = String(subject.level_id || "").trim();
        const curriculumId = String(subject.curriculum_id || "").trim();

        if (!subjectId) return;

        const topicsKey = glipCacheKey([
          SCHOOL,
          curriculumId || levelId || subjectLevel,
          subjectId,
          "topics"
        ]);

        try {
          const result = await postToGlip({
            action: "getTopics",
            curriculum_id: curriculumId,
            subject_id: subjectId,
            level_id: levelId,
            level: subjectLevel,
            userType: sessionStorage.getItem("glipUserType") || "student",
            teacher_id: sessionStorage.getItem("glipTeacherId") || "",
          });

          if (!result || result.status === "error") return;

          const topics = Array.isArray(result.topics) ? result.topics : [];
          writeTimedLocalCache(topicsKey, topics);

          const imagePromises = topics
            .filter(function (topic) {
              return topic.available === true;
            })
            .map(function (topic) {
              const image = getTopicImageFromSubjectPage(subjectCode, topic);

              if (!image) return Promise.resolve(false);

              return preloadImage(image);
            });

          await Promise.all(imagePromises);
        } catch (err) {
          console.warn("Could not preload topics for " + subjectId, err);
        }
      }

      function getOrderedSubjectsForTopicPreload(subjects) {
        if (!Array.isArray(subjects)) return [];

        if (isTeacherUser()) {
          return subjects
            .filter(function (subject) {
              return subject.visible !== false;
            })
            .map(function (subject) {
              return { subject: subject, status: "not_started" };
            });
        }

        const order = {
          in_progress: 1,
          not_started: 2,
          completed: 3,
        };

        return subjects
          .filter(function (subject) {
            const status = getSubjectStatus(subject, progressItems);
            return subject.visible === true && status !== "completed";
          })
          .map(function (subject) {
            return {
              subject: subject,
              status: getSubjectStatus(subject, progressItems),
            };
          })
          .sort(function (a, b) {
            return order[a.status] - order[b.status];
          });
      }

      async function startBackgroundTopicPreload(subjects) {
        if (isStudentUser() && window.GLIPLearningSession && window.GLIPLearningSession.read()) return;

        const userType = sessionStorage.getItem("glipUserType") || "";
        const teacherId = sessionStorage.getItem("glipTeacherId") || "";
        const studentId = sessionStorage.getItem("glipStudentId") || "";
        const userId = teacherId || studentId || "anonymous";
        const preloadDoneKey = [
          "glipTopicPreloadDone",
          window.GLIP_CACHE_VERSION || "default",
          SCHOOL,
          userType,
          userId,
        ].join("_");

        if (topicPreloadStarted) return;
        if (!Array.isArray(subjects) || !subjects.length) return;

        if (userType === "student" && !studentId) return;
        if (isTeacherUser() && !teacherId) return;

        if (sessionStorage.getItem(preloadDoneKey) === "true") return;

        topicPreloadStarted = true;
        const orderedSubjects = getOrderedSubjectsForTopicPreload(subjects);

        await Promise.all(
          orderedSubjects.map(function (item) {
            const subjectId = String(item.subject.subject_id || "").trim();
            if (!subjectId) return Promise.resolve();

            return preloadTopicsForSubject(item.subject);
          }),
        );

        sessionStorage.setItem(preloadDoneKey, "true");
      }

      function startBackgroundTopicPreloadSoon(subjects) {
        setTimeout(function () {
          startBackgroundTopicPreload(subjects);
        }, 150);
      }


      
function getTeacherAssignedLevels() {
  const permissions = getTeacherPermissions();

  const levels = permissions
    .filter(function (permission) {
      return (
        permission.active !== false &&
        String(permission.active).toLowerCase() !== "false"
      );
    })
    .map(function (permission) {
      return normaliseLevel(permission.level);
    })
    .filter(Boolean);

  return Array.from(new Set(levels)).sort();
}

function getTeacherSubjectCacheForLevel(level) {
  const userType = sessionStorage.getItem("glipUserType") || "";
  const teacherId = sessionStorage.getItem("glipTeacherId") || "";
  const subjectLevel = normaliseLevel(level);
  const key = glipCacheKey([
    SCHOOL,
    subjectLevel,
    userType,
    teacherId,
    "",
    "subjects",
  ]);

  return readTimedLocalCache(key, SUBJECT_CACHE_DURATION);
}

function setTeacherSubjectCacheForLevel(level, subjects) {
  const userType = sessionStorage.getItem("glipUserType") || "";
  const teacherId = sessionStorage.getItem("glipTeacherId") || "";
  const subjectLevel = normaliseLevel(level);
  const key = glipCacheKey([
    SCHOOL,
    subjectLevel,
    userType,
    teacherId,
    "",
    "subjects",
  ]);

  writeTimedLocalCache(key, subjects);
}

async function fetchSubjectsForLevel(level) {
  const subjectLevel = normaliseLevel(level);

  try {
    const res = await fetch(getWebAppUrl(), {
      method: "POST",
      body: JSON.stringify({
        action: "getSubjects",
        level: subjectLevel,
        userType: sessionStorage.getItem("glipUserType") || "",
        teacher_id: sessionStorage.getItem("glipTeacherId") || "",
      }),
    });

    const data = await res.json();

    if (data.status !== "success") {
      throw new Error(data.message || "Error loading subjects");
    }

    const subjects = Array.isArray(data.subjects) ? data.subjects : [];
    setTeacherSubjectCacheForLevel(subjectLevel, subjects);
    return subjects;
  } catch (err) {
    console.error(err);
    return [];
  }
}


function getAllTeacherSubjectsCache() {
  const userType = sessionStorage.getItem("glipUserType") || "";
  const teacherId = sessionStorage.getItem("glipTeacherId") || "";
  if (!userType || !teacherId) return null;

  return readTimedLocalCache(glipCacheKey([
    SCHOOL,
    userType,
    teacherId,
    "all-subjects"
  ]), SUBJECT_CACHE_DURATION);
}

function setAllTeacherSubjectsCache(subjects) {
  const userType = sessionStorage.getItem("glipUserType") || "";
  const teacherId = sessionStorage.getItem("glipTeacherId") || "";
  if (!userType || !teacherId || !Array.isArray(subjects)) return;

  writeTimedLocalCache(glipCacheKey([
    SCHOOL,
    userType,
    teacherId,
    "all-subjects"
  ]), subjects);
}

async function fetchAllTeacherSubjects() {
  try {
    const result = await postToGlip({
      action: "getSubjects",
      userType: sessionStorage.getItem("glipUserType") || "",
      teacher_id: sessionStorage.getItem("glipTeacherId") || ""
    });

    if (!result || result.status !== "success") {
      throw new Error(
        (result && result.message) || "Error loading assigned subjects"
      );
    }

    const subjects = Array.isArray(result.subjects) ? result.subjects : [];
    setAllTeacherSubjectsCache(subjects);
    return subjects;
  } catch (err) {
    console.error(err);
    return null;
  }
}

function groupTeacherSubjects(subjects) {
  const assignmentsByLevel = {};

  (subjects || []).forEach(function (subject) {
    const level = normaliseLevel(subject.level);

    if (!level) return;

    if (!assignmentsByLevel[level]) {
      assignmentsByLevel[level] = [];
    }

    assignmentsByLevel[level].push(subject);
    setTeacherSubjectCacheForLevel(level, assignmentsByLevel[level]);
  });

  return assignmentsByLevel;
}

function rebuildTeacherPermissionsFromSubjects(subjects) {
  const existingPermissions = getTeacherPermissions();
  const permissionsByKey = {};

  existingPermissions.forEach(function (permission) {
    const key = [
      normaliseLevel(permission.level),
      String(permission.subject_id || "").trim(),
      String(permission.class_id || "").trim()
    ].join("|");

    permissionsByKey[key] = permission;
  });

  (subjects || []).forEach(function (subject) {
    const level = normaliseLevel(subject.level);
    const subjectId = String(subject.subject_id || "").trim();
    const classId = String(subject.class_id || "").trim();

    if (!level || !subjectId) return;

    const key = [level, subjectId, classId].join("|");

    permissionsByKey[key] = Object.assign(
      {},
      permissionsByKey[key] || {},
      {
        level: level,
        level_id: subject.level_id || "",
        curriculum_id: subject.curriculum_id || "",
        subject_id: subjectId,
        subject_code: subject.subject_code || "",
        subject_name: subject.subject_name || "",
        class_id: classId,
        access_type: subject.access_type || "current",
        active: subject.active !== false
      }
    );
  });

  sessionStorage.setItem(
    "glipTeacherPermissions",
    JSON.stringify(Object.values(permissionsByKey))
  );
}

async function loadTeacherDashboard() {
  const dashboard = document.getElementById("teacher-dashboard");
  const normalGrid = document.getElementById("topic-grid");
  const cachedSubjects = getAllTeacherSubjectsCache();

  function showSubjects(subjects) {
    if (!Array.isArray(subjects)) return false;

    if (!subjects.length) {
      const loadingProgress = document.getElementById("subjectsLoadingProgress");
      if (loadingProgress) loadingProgress.style.display = "none";
      if (normalGrid) normalGrid.style.display = "none";
      if (dashboard) {
        dashboard.style.display = "";
        dashboard.innerHTML = `
          <p class="q">
            No subjects have been assigned to your account. Please contact your administrator if you believe this is incorrect.
          </p>
        `;
      }
      return true;
    }

    rebuildTeacherPermissionsFromSubjects(subjects);
    renderTeacherDashboard(groupTeacherSubjects(subjects));
    startBackgroundTopicPreloadSoon(subjects);
    return true;
  }

  // Render the login-warmed copy immediately. This also makes the Back to
  // Subject List route instant instead of showing the loading screen again.
  if (cachedSubjects) showSubjects(cachedSubjects);

  const freshSubjects = await fetchAllTeacherSubjects();

  if (freshSubjects === null) {
    if (cachedSubjects) return;

    const loadingProgress = document.getElementById("subjectsLoadingProgress");
    if (loadingProgress) loadingProgress.style.display = "none";
    if (normalGrid) normalGrid.style.display = "none";
    if (dashboard) {
      dashboard.style.display = "";
      dashboard.innerHTML = `
        <p class="q">
          GLIP could not load your assigned subjects. Please refresh the page.
        </p>
      `;
    }
    return;
  }

  showSubjects(freshSubjects);
}


      async function fetchAllSubjectsForAdmin() {
  try {
    const result = await postToGlip({
      action: "getAllSubjectsAdmin",
      admin_teacher_id: sessionStorage.getItem("glipTeacherId") || "",
    });

    if (!result || result.status !== "success") {
      throw new Error(result.message || "Error loading admin subjects");
    }

    return Array.isArray(result.subjects) ? result.subjects : [];
  } catch (err) {
    console.error(err);
    return [];
  }
}

function groupAdminSubjectsByLevel(subjects) {
  const grouped = {};

  subjects.forEach(function (subject) {
    const level = normaliseLevel(subject.level);
    if (!grouped[level]) grouped[level] = [];

    grouped[level].push(subject);
  });

  return grouped;
}
      
      
async function loadAdminDashboard() {
  const subjects = await fetchAllSubjectsForAdmin();
  const dashboard = document.getElementById("teacher-dashboard");
  const normalGrid = document.getElementById("topic-grid");

  if (!subjects.length) {
    if (normalGrid) {
      normalGrid.style.display = "none";
    }

    if (dashboard) {
      dashboard.style.display = "";
      dashboard.innerHTML = `
        <p class="q">
          No subjects are available. Please check the Subjects sheet.
        </p>
      `;
    }

    return;
  }

  const assignmentsByLevel = groupAdminSubjectsByLevel(subjects);

  renderTeacherDashboard(assignmentsByLevel);
}


      

      

function refreshStudentSubjectBadges() {
  if (!isStudentUser() || !window.GLIPLearningSession || !window.GLIPProgressEngine) return;

  const subjects = window.GLIPLearningSession.getSubjects();
  if (!Array.isArray(subjects)) return;

  document.querySelectorAll(".topic-card[data-subject-id]").forEach(function (card) {
    const curriculumId = String(card.dataset.curriculumId || "").trim();
    const subjectId = String(card.dataset.subjectId || "").trim().toLowerCase();
    const level = normaliseLevel(card.dataset.level || "");

    const subject = subjects.find(function (item) {
      if (curriculumId && String(item.curriculum_id || "") === curriculumId) return true;
      const keys = [item.subject_pk, item.subject_id, item.subject_code]
        .map(function (value) { return String(value || "").trim().toLowerCase(); })
        .filter(Boolean);
      return keys.indexOf(subjectId) !== -1 &&
        (!level || normaliseLevel(item.level || item.level_code) === level);
    });

    if (!subject) return;
    const badge = card.querySelector(".topic-badge");
    window.GLIPProgressEngine.applyBadge(
      badge,
      window.GLIPProgressEngine.getSubjectStatus(subject)
    );
  });
}

function loadSubjects() {
  if (isAdminUser()) {
    loadAdminDashboard();
    return;
  }

  if (isTeacherUser()) {
    loadTeacherDashboard();
    return;
  }

  const cachedSubjects = getSubjectCache();

        // Only a populated student cache is safe to render immediately.
        // An empty array may be a stale cache written during the failed
        // v374/v375 session bootstrap and must not suppress a fresh request.
        if (Array.isArray(cachedSubjects) && cachedSubjects.length > 0) {
          // Keep the fast cached first paint, but never let a learner-facing
          // assignment cache suppress a fresh visibility check.
          renderSubjects(cachedSubjects);
          fetchProgressForSubjects(cachedSubjects).then(function () {
            startBackgroundTopicPreloadSoon(cachedSubjects);
          });
        }

        fetchSubjects().then(function (subjects) {
          if (Array.isArray(subjects)) {
            renderSubjects(subjects);

            if (subjects.length > 0) {
              fetchProgressForSubjects(subjects).then(function () {
                startBackgroundTopicPreloadSoon(subjects);
              });
            }
            return;
          }

          if (!Array.isArray(cachedSubjects) || !cachedSubjects.length) {
            document.getElementById("topic-grid").innerHTML =
              "Unable to load subjects";
          }
        });
      }

document.addEventListener("click", function (event) {
  const card = event.target.closest(".topic-card[data-subject-id]");

  if (!card) return;

  const subjectId = card.dataset.subjectId || "";
  const level = card.dataset.level || "";
  const levelId = card.dataset.levelId || "";
  const curriculumId = card.dataset.curriculumId || "";

  if (!subjectId || (!level && !levelId && !curriculumId)) return;

  sessionStorage.setItem("glipLevel", level);
  sessionStorage.setItem("glipSubjectId", subjectId);

  if (levelId) {
    sessionStorage.setItem("glipLevelId", levelId);
  } else {
    sessionStorage.removeItem("glipLevelId");
  }

  if (curriculumId) {
    sessionStorage.setItem("glipCurriculumId", curriculumId);
  } else {
    sessionStorage.removeItem("glipCurriculumId");
  }

  const subjectName =
    card.querySelector(".topic-card-caption")?.textContent?.trim() || "";

  if (subjectName) {
    sessionStorage.setItem("glipSubjectName", subjectName);
  } else {
    sessionStorage.removeItem("glipSubjectName");
  }

  if (isTeacherUser()) {
    storeTeacherSubjectContext(level, subjectId, levelId, curriculumId);
  }
});

      
      document.addEventListener("glipReady", function () {
        loadSubjects();
      });

      window.addEventListener("pageshow", function () {
        refreshStudentSubjectBadges();
      });

      window.addEventListener("glipProgressSaved", function () {
        refreshStudentSubjectBadges();
      });
    </script>
