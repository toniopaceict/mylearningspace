<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../../assets/GLIP-icon-transparent.png" />
    
    <title>GLIP – Guided Learning for Independent Progress</title>

    <script>
      window.PAGE_MENU_CONTEXT = {
        type: "home",
        school: getSchoolFromUrl(),
      };

      function getWebAppUrl() {
        return window.getGlipWebAppUrl();
      }

      const SCHOOL = getSchoolFromUrl();

      function getSchoolFromUrl() {
        const match = window.location.pathname.match(/\/schools\/([^/]+)\//);
      
        if (match) {
          return match[1];
        }
      
        return "";
      }
    </script>
    <script src="https://toniopaceict.github.io/mylearningspace/js/site-loader.js"></script>

    <style>
      .login-staff-option {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .login-staff-option input {
        width: 18px;
        height: 18px;
        margin: 0;
      }
    </style>

  </head>

  <body>
    <div id="header-placeholder"></div>

    <div class="page-shell">
      <header class="page-hero">
        <div class="page-hero-panel">
          <div class="page-hero-divider-top"></div>

          <img
            class="page-hero-brand-icon"
            src="../../assets/GLIP-icon-transparent-cropped.png"
            alt="GLIP logo"
          />

          <div class="page-hero-logo">GLIP</div>

          <p class="page-hero-topline">
            Guided Learning for Independent Progress
          </p>

          <h1>Welcome</h1>
          <h2 id="schoolNameHeading">School</h2>

          <div class="page-hero-divider-bottom"></div>
        </div>

      <div class="wrap">
        <fieldset class="task-box login-box">
          <legend>Enter your code to continue</legend>

          <p>Use your student or teacher code to access the platform.</p>

          <div class="login-row">
            <input
              type="text"
              id="codeInput"

              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
            />

            <button id="loginBtn" class="login-btn glip-btn">Continue</button>
          </div>

          <label class="login-staff-option">
            <input type="checkbox" id="staffMemberInput" />

    <script>
      document.addEventListener("glipReady", function () {
        const heading = document.getElementById("schoolNameHeading");

        if (!heading || typeof window.getCurrentSchoolConfig !== "function") {
          return;
        }

        try {
          heading.textContent = window.getCurrentSchoolConfig().label;
        } catch (error) {
          heading.textContent = "School";
          console.warn(error);
        }
      });

      function showMessage(text, type) {
        const el = document.getElementById("loginMessage");
        el.textContent = text;
        el.style.color = type === "error" ? "red" : "#0b3c6f";
      }

      function showLoginProgress() {
        document.getElementById("loginProgress").classList.add("show");
        document.getElementById("loginLog").classList.add("show");
      }

      function hideLoginProgress() {
        document.getElementById("loginProgress").classList.remove("show");
      }

      let logDelay = 0;

      function addLoginLog(text) {
        const log = document.getElementById("loginLog");

        logDelay += 250;

        setTimeout(function () {
          const item = document.createElement("li");
          item.textContent = text;
          log.appendChild(item);

          item.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
          });
        }, logDelay);
      }

      function resetLogDelay() {
        logDelay = 0;
      }

      function clearLoginLog() {
        document.getElementById("loginLog").innerHTML = "";
      }

      function getLevelNumber(level) {
        const match = String(level || "").match(/\d+/);
        return match ? match[0].padStart(2, "0") : "";
      }

      function getLevelFolder(level) {
        const levelNumber = getLevelNumber(level);
        return levelNumber ? "level-" + levelNumber : "";
      }
      
      function getSubjectsHomeUrl(level) {
        return "subjects-home.html";
      }

      function glipCacheKey(parts) {
        return window.GLIP_CACHE.makeKey(parts);
      }

      function saveLocalCache(key, data) {
        window.GLIP_CACHE.writeLocal(key, data);
      }

      function saveSessionCache(key, data) {
        window.GLIP_CACHE.writeSession(key, data);
      }

      function postToGlip(data) {
        return fetch(getWebAppUrl(), {
          method: "POST",
          body: JSON.stringify(data),
        }).then(function (res) {
          return res.json();
        });
      }

      function preloadImage(src) {
        return new Promise(function (resolve) {
          const img = new Image();

          img.onload = function () {
            resolve(true);
          };

          img.onerror = function () {
            resolve(false);
          };

          img.src = src;
        });
      }


      function getTopicCacheKey(subject) {
        return glipCacheKey([
          SCHOOL,
          String(subject.curriculum_id || subject.level_id || subject.level || "").trim(),
          String(subject.subject_id || "").trim(),
          "topics"
        ]);
      }

      function getTopicPageCacheKey(subject, topic) {
        return "glip_topic_page_data_" + [
          SCHOOL,
          String(subject.curriculum_id || subject.level_id || subject.level || "").trim(),
          String(topic.topic_pk || topic.topic_id || topic.topic_code || "").trim()
        ].join("_");
      }

      function normaliseTopicPagePreload(data, subject, topic) {
        const source = data && data.topic_page ? data.topic_page : data || {};
        const sourceTopic = source.topic || {};
        const sourceSubject = source.subject || {};
        const sourceLevel = source.level || {};

        return {
          school: String(source.school || SCHOOL || "").trim(),
          curriculum_id: String(source.curriculum_id || subject.curriculum_id || "").trim(),
          topic_id: String(sourceTopic.topic_id || topic.topic_pk || topic.topic_id || "").trim(),
          topic_code: String(sourceTopic.topic_code || topic.topic_code || topic.topic_id || "").trim(),
          topic_name: String(sourceTopic.topic_name || topic.topic_name || "").trim(),
          subject_id: String(sourceSubject.subject_id || subject.subject_id || "").trim(),
          subject_code: String(sourceSubject.subject_code || subject.subject_code || "").trim(),
          subject_name: String(sourceSubject.subject_name || subject.subject_name || "").trim(),
          level_id: String(sourceLevel.level_id || subject.level_id || "").trim(),
          level_code: String(sourceLevel.level_code || subject.level || "").trim(),
          activities: Array.isArray(source.activities) ? source.activities : []
        };
      }

      async function runWithConcurrency(items, limit, worker) {
        const queue = Array.isArray(items) ? items.slice() : [];
        const runners = [];
        const runnerCount = Math.min(Math.max(1, limit || 1), queue.length);

        async function runNext() {
          while (queue.length) {
            const item = queue.shift();
            try {
              await worker(item);
            } catch (error) {
              console.warn("Learning-space preload item failed:", error);
            }
          }
        }

        for (let i = 0; i < runnerCount; i += 1) runners.push(runNext());
        await Promise.all(runners);
      }

      async function preloadTopicsAndTopicPages(subjects, userType, userId, progressItems) {
        const progress = Array.isArray(progressItems) ? progressItems : [];
        const visibleSubjects = (Array.isArray(subjects) ? subjects : []).filter(function (subject) {
          return subject && subject.visible !== false && subject.active !== false;
        });

        if (!visibleSubjects.length) return;

        addLoginLog("Loading topics and topic images...");

        await runWithConcurrency(visibleSubjects, 3, async function (subject) {
          const subjectId = String(subject.subject_id || "").trim();
          const subjectCode = String(subject.subject_code || "").trim();
          if (!subjectId) return;

          const result = await postToGlip({
            action: "getTopics",
            curriculum_id: String(subject.curriculum_id || "").trim(),
            subject_id: subjectId,
            level_id: String(subject.level_id || "").trim(),
            level: String(subject.level || "").trim(),
            userType: userType,
            teacher_id: userType === "student" ? "" : userId,
            student_id: userType === "student" ? userId : ""
          });

          if (!result || result.status !== "success") return;

          const topics = Array.isArray(result.topics) ? result.topics : [];
          saveLocalCache(getTopicCacheKey(subject), topics);

          await Promise.all(topics.filter(function (topic) {
            return topic.available === true;
          }).map(function (topic) {
            const topicFolder = String(topic.topic_code || topic.topic_id || "").trim();
            if (!subjectCode || !topicFolder) return Promise.resolve(false);
            return preloadImage(
              "../../content/" + subjectCode + "/" + topicFolder +
              "/assets/" + topicFolder + ".jpg"
            );
          }));

          await runWithConcurrency(topics.filter(function (topic) {
            return topic.available === true;
          }), 2, async function (topic) {
            const pageResult = await postToGlip({
              action: "getTopicPageData",
              school_id: SCHOOL,
              curriculum_id: String(subject.curriculum_id || "").trim(),
              topic_id: String(topic.topic_pk || topic.topic_id || "").trim(),
              topic_code: String(topic.topic_code || topic.topic_id || "").trim(),
              subject_id: subjectId,
              subject_code: subjectCode,
              level_id: String(subject.level_id || "").trim(),
              level: String(subject.level || "").trim(),
              userType: userType,
              teacher_id: userType === "student" ? "" : userId,
              student_id: userType === "student" ? userId : ""
            });

            if (!pageResult || pageResult.status !== "success") return;

            const topicPageData = normaliseTopicPagePreload(pageResult, subject, topic);

            sessionStorage.setItem(
              getTopicPageCacheKey(subject, topic),
              JSON.stringify({
                saved_at: Date.now(),
                data: topicPageData
              })
            );

            // Student-only predictive loading. The same central algorithm is
            // used wherever GLIP needs to decide the learner's next step.
            if (userType === "student" && window.GLIPNextActivity) {
              const topicActivityIds = new Set(topicPageData.activities.map(function (activity) {
                return String(activity.activity_id || "").trim();
              }));
              const topicProgress = progress.filter(function (item) {
                return topicActivityIds.has(String(item.activity_id || "").trim());
              });
              const nextActivity = window.GLIPNextActivity.getNextActivity(
                topicPageData.activities,
                topicProgress
              );
              const nextContext = Object.assign({}, topicPageData, {
                student_id: userId,
                base_url: "../..",
                topic_base_url: "../../content/" + subjectCode + "/" +
                  String(topicPageData.topic_code || "").trim()
              });
              const nextUrl = window.GLIPNextActivity.buildActivityUrl(nextContext, nextActivity);
              window.GLIPNextActivity.saveRecommendation(nextContext, nextActivity, nextUrl);
              if (nextUrl) await window.GLIPNextActivity.preloadUrl(nextUrl);
            }
          });
        });

        addLoginLog("Topics and learning pages ready.");
      }

      async function preloadStudentData(student) {
        const studentId = String(student.student_id || "").trim();
        const rawLevel = String(student.level || "").trim();
        
        if (!rawLevel) {
          throw new Error("Student level missing");
        }

const level = getLevelFolder(rawLevel);

        if (!studentId || !level) return;

        try {
          addLoginLog("Loading your subjects...");

const subjectsResult = await postToGlip({
  action: "getSubjects",
  level: level,
  userType: "student",
  student_id: studentId,
});

          if (!subjectsResult || subjectsResult.status !== "success") return;

          const subjects = Array.isArray(subjectsResult.subjects)
            ? subjectsResult.subjects
            : [];

          saveLocalCache(glipCacheKey([SCHOOL, "student", "", studentId, "subjects"]), subjects);
          addLoginLog("Subjects loaded.");

          const visibleSubjects = subjects.filter(function (subject) {
            return subject.visible === true;
          });

          addLoginLog("Loading subject images...");

          const imagePromises = visibleSubjects.map(function (subject) {
            const subjectId = String(subject.subject_id || "").trim();
            const subjectCode = String(subject.subject_code || subjectId).trim();
            if (!subjectCode) return Promise.resolve(false);

            return preloadImage(
              "../../content/" +
                subjectCode +
                "/assets/" +
                subjectCode +
                ".jpg"
            );
          });

          addLoginLog("Preparing your progress icons...");

          const progressPromises = visibleSubjects.map(function (subject) {
            const subjectId = String(subject.subject_id || "").trim();
            if (!subjectId) return Promise.resolve([]);

            return postToGlip({
              action: "getMyProgress",
              student_id: studentId,
              subject_id: subjectId,
              level: level,
            }).then(function (progressResult) {
              if (
                progressResult &&
                progressResult.status === "success" &&
                Array.isArray(progressResult.progress)
              ) {
                const subjectProgress = progressResult.progress.map(
                  function (item) {
                    return {
                      subject_id: subjectId,
                      topic_id: String(item.topic_id || "").trim(),
                      level: window.GLIP_CACHE.normaliseLevel(
                        item.level || subject.level || level
                      ),
                      activity_id: item.activity_id,
                      status: item.status || "not_started",
                    };
                  }
                );

                window.GLIP_CACHE.writeProgress({
                  school: SCHOOL,
                  level: subject.level || level,
                  studentId: studentId,
                  subjectId: subjectId
                }, subjectProgress);

                return subjectProgress;
              }

              return [];
            });
          });

          const progressResults = await Promise.allSettled(progressPromises);

          const successfulProgress = progressResults
            .filter(function (result) {
              return result.status === "fulfilled";
            })
            .map(function (result) {
              return result.value;
            });
          addLoginLog("Progress icons ready.");

          await Promise.all(imagePromises);
          addLoginLog("Subject images ready.");

          const mergedProgress = successfulProgress.flat();

          window.GLIP_CACHE.writeAllProgress({
            school: SCHOOL,
            studentId: studentId
          }, mergedProgress);

          addLoginLog("Preparing your next activities...");
          await preloadTopicsAndTopicPages(
            visibleSubjects,
            "student",
            studentId,
            mergedProgress
          );
          addLoginLog("Your next activities are ready.");
          sessionStorage.setItem("glipProgressTime", String(Date.now()));
        } catch (err) {
          console.warn("Preload skipped:", err);
        }
      }

      async function preloadTeacherSubjects(teacher, userType) {
        if (!teacher || !teacher.teacher_id) return;
        if (userType !== "lead_teacher" && userType !== "subject_teacher") return;

        const teacherId = String(teacher.teacher_id || "").trim();
        addLoginLog("Loading Subjects...");

        try {
          const result = await postToGlip({
            action: "getSubjects",
            userType: userType,
            teacher_id: teacherId
          });

          if (!result || result.status !== "success") {
            throw new Error((result && result.message) || "Assigned subjects could not be loaded.");
          }

          const subjects = Array.isArray(result.subjects) ? result.subjects : [];

          saveLocalCache(glipCacheKey([
            SCHOOL,
            userType,
            teacherId,
            "all-subjects"
          ]), subjects);

          const subjectsByLevel = {};
          subjects.forEach(function (subject) {
            const level = getLevelFolder(subject.level || "");
            if (!level) return;
            if (!subjectsByLevel[level]) subjectsByLevel[level] = [];
            subjectsByLevel[level].push(subject);
          });

          Object.keys(subjectsByLevel).forEach(function (level) {
            saveLocalCache(glipCacheKey([
              SCHOOL,
              level,
              userType,
              teacherId,
              "",
              "subjects"
            ]), subjectsByLevel[level]);
          });

          addLoginLog("Loading subject images...");
          await Promise.all(subjects.filter(function (subject) {
            return subject.visible !== false;
          }).map(function (subject) {
            const subjectCode = String(subject.subject_code || "").trim();
            if (!subjectCode) return Promise.resolve(false);
            return preloadImage(
              "../../content/" + subjectCode + "/assets/" + subjectCode + ".jpg"
            );
          }));

          await preloadTopicsAndTopicPages(subjects, userType, teacherId, []);
          addLoginLog("Subjects ready.");
        } catch (error) {
          console.warn("Teacher learning-space preload failed:", error);
        }
      }

      async function preloadManagementData(teacher, userType) {
        if (!teacher || !teacher.teacher_id) return;

        // Administrators receive the five priority management datasets in one
        // request. Apps Script still creates the existing per-page cache
        // entries, so every management page continues to use its normal cache.
        if (userType !== "owner" && userType !== "admin") return;

        const fallbackStages = [
          { key: "teachers", label: "Loading Teacher Management..." },
          { key: "classes", label: "Loading Class Management..." },
          { key: "teaching_assignments", label: "Loading Teaching Assignments..." },
          { key: "students", label: "Loading Student Management..." },
          { key: "student_subjects", label: "Loading Student Assignments..." }
        ];

        function installResult(result) {
          return !!(
            result &&
            result.status === "success" &&
            window.GLIPManagementCache &&
            window.GLIPManagementCache.installBootstrap(result)
          );
        }

        addLoginLog("Preparing priority management pages...");

        try {
          const bundled = await postToGlip({
            action: "getAdminPriorityBootstrap",
            teacher_id: teacher.teacher_id,
            role: userType,
            performance_category: "login",
            performance_initiator: "admin_login_priority",
            performance_target: "admin_priority_bundle"
          });

          if (installResult(bundled)) {
            addLoginLog("Priority management pages ready.");
            return;
          }

          console.warn("Bundled management preload was not completed. Using staged fallback.", bundled);
        } catch (bundleError) {
          console.warn("Bundled management preload failed. Using staged fallback.", bundleError);
        }

        // Compatibility fallback: if the new endpoint is unavailable or a
        // deployment is temporarily mixed, use the proven v271 staged flow.
        let installedAnyData = false;
        for (const stage of fallbackStages) {
          addLoginLog(stage.label);
          try {
            const result = await postToGlip({
              action: "getManagementBootstrapStage",
              teacher_id: teacher.teacher_id,
              role: userType,
              stage: stage.key,
              performance_category: "login",
              performance_initiator: "admin_login_priority_fallback",
              performance_target: stage.key
            });
            if (installResult(result)) installedAnyData = true;
          } catch (stageError) {
            console.warn("Management preload fallback failed:", stage.key, stageError);
          }
        }

        addLoginLog(installedAnyData
          ? "Management pages ready."
          : "Management data will load when needed.");
      }

      let preLoginWarmPromise = null;
      let preLoginWarmStarted = false;

      function startPreLoginWarm() {
        if (preLoginWarmStarted) return preLoginWarmPromise;
        preLoginWarmStarted = true;
        preLoginWarmPromise = postToGlip({
          action: "warmPreLoginBootstrap",
          school_id: SCHOOL,
          performance_category: "cache_warm",
          performance_initiator: "pre_login_warm",
          performance_target: "relational_snapshot",
          performance_skip_routine_log: true
        }).catch(function (error) {
          console.warn("Pre-login warming was not completed:", error);
          return null;
        });
        return preLoginWarmPromise;
      }

      document.addEventListener("glipReady", function () {
        // Yield briefly so the login form paints first, then use the time while
        // the user enters their code to warm school-wide data.
        setTimeout(startPreLoginWarm, 100);
      }, { once: true });

      async function login() {
        const codeInput = document.getElementById("codeInput");
        const loginBtn = document.getElementById("loginBtn");
        const code = codeInput.value.trim();

        if (!code) {
          showMessage("Please enter your code.", "error");
          return;
        }

        loginBtn.disabled = true;
        showMessage("");

        clearLoginLog();
        resetLogDelay();
        showLoginProgress();
        addLoginLog("Checking your code...");
        // Ensure warming has at least been started. Login does not wait for the
        // browser promise; Apps Script shares the same snapshot/cache lock.
        startPreLoginWarm();

        try {
          const result = await postToGlip({
            action: "loginUser",
            code: code,
            staff_member: document.getElementById("staffMemberInput").checked,
          });

          if (result.status !== "success") {
            showMessage(result.message || "Invalid code.", "error");
            hideLoginProgress();
            loginBtn.disabled = false;
            return;
          }

          const userType = String(result.userType || "").trim().toLowerCase();

          sessionStorage.clear();
          sessionStorage.setItem("glipSchool", SCHOOL);
          sessionStorage.setItem("glipUserType", userType);

          if (userType === "student") {
            const student = result.student;
          const rawStudentLevel = String(student.level || "").trim();
          
          if (!rawStudentLevel) {
            showMessage("Your account level is missing. Please contact your lecturer.", "error");
            hideLoginProgress();
            loginBtn.disabled = false;
            return;
          }
          
          const studentLevel = getLevelFolder(rawStudentLevel);

          sessionStorage.setItem("glipStudentId", student.student_id);
          sessionStorage.setItem("glipStudentName", student.student_name);
          sessionStorage.setItem("glipStudentSurname", student.student_surname || "");
          sessionStorage.setItem("glipStudentFullName", student.full_name || student.student_name);
          sessionStorage.setItem("glipLevel", studentLevel);
          sessionStorage.setItem("glipClassId", student.class_id);
          sessionStorage.setItem("glipClassLabel", student.class_label || student.class_id);
          sessionStorage.setItem("glipRole", "student");
          sessionStorage.setItem("glipUserType", "student");

          if (result.learningSession && window.GLIPLearningSession) {
            window.GLIPLearningSession.write(result.learningSession);
          }

            addLoginLog("Code accepted.");
            addLoginLog("Preparing your learning space...");

            await preloadStudentData(student);

            addLoginLog("Ready. Opening your learning space...");

            window.location.href = getSubjectsHomeUrl(studentLevel);
            return;
          }

            if (
              userType === "owner" ||
              userType === "admin" ||
              userType === "lead_teacher" ||
              userType === "subject_teacher"
            ) {
            const teacher = result.teacher;
            const firstPermission =
              teacher.permissions && teacher.permissions[0];

            const teacherLevel =
              firstPermission && firstPermission.level
                ? getLevelFolder(firstPermission.level)
                : "";


sessionStorage.setItem("glipTeacherId", teacher.teacher_id);
sessionStorage.setItem("glipTeacherName", teacher.teacher_name);
sessionStorage.setItem("glipTeacherSurname", teacher.teacher_surname || "");
sessionStorage.setItem("glipTeacherFullName", teacher.full_name || teacher.teacher_name);
sessionStorage.setItem("glipTeacherRole", userType);
sessionStorage.setItem("glipRole", userType);
sessionStorage.setItem(
  "glipTeacherPermissions",
  JSON.stringify(teacher.permissions || [])
);




              

            showMessage("Login successful.");

            await preloadTeacherSubjects(teacher, userType);

            if (userType === "owner" || userType === "admin") {
              await preloadManagementData(teacher, userType);
            }

            if (userType === "owner" || userType === "admin") {
              // The queue is stored in sessionStorage so it survives page
              // navigation. Each management page resumes whatever remains.
              sessionStorage.setItem(
                "glipAdminBackgroundWarmQueue",
                JSON.stringify({
                  actions: [
                    "listCurriculumManagementAdmin",
                    "getAllSubjectsAdmin",
                    "listLevelsManagementAdmin",
                    "listLevelsAdmin",
                    "getCurriculumTopicManagement"
                  ],
                  warmSubjectsHome: true
                })
              );

              addLoginLog("Ready. Opening Teacher Management...");
              window.location.replace(
                "/mylearningspace/schools/management/teacher-management.html"
              );
              return;
            }

            addLoginLog("Ready. Opening GLIP...");
            window.location.replace(getSubjectsHomeUrl(teacherLevel));
            return;

              
          }

          showMessage("Unknown user type.", "error");
          loginBtn.disabled = false;
        } catch (err) {
          showMessage("Connection error.", "error");
          console.error(err);

          hideLoginProgress();

          loginBtn.disabled = false;
        }
      }

      async function wakeUpAppsScript() {
        try {
          await fetch(getWebAppUrl() + "?action=ping", {
            method: "GET",
            cache: "no-store",
          });
        } catch (error) {
          console.warn("Wake-up request failed:", error);
        }
      }

      document.addEventListener("glipReady", wakeUpAppsScript);

      window.addEventListener("pageshow", function () {
        const userType = sessionStorage.getItem("glipUserType");

        if (!userType) return;

        const level = getLevelFolder(sessionStorage.getItem("glipLevel") || "");
        const permissions = JSON.parse(
          sessionStorage.getItem("glipTeacherPermissions") || "[]"
        );

        if (userType === "student") {
          if (!level) {
            showMessage(
              "Your account level is missing. Please contact your teacher.",
              "error"
            );
            return;
          }

          window.location.replace(getSubjectsHomeUrl(level));
          return;
        }

if (userType === "owner" || userType === "admin") {
  window.location.replace(
    "/mylearningspace/schools/management/teacher-management.html"
  );
  return;
}

if (
  userType === "lead_teacher" ||
  userType === "subject_teacher"
) {
  const firstPermission = permissions[0];

  const teacherLevel =
    firstPermission && firstPermission.level
      ? getLevelFolder(firstPermission.level)
      : "";

  window.location.replace(getSubjectsHomeUrl(teacherLevel));
}
        

        
      });

      document.getElementById("loginBtn").addEventListener("click", login);

      document
        .getElementById("codeInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") login();
        });

      document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("codeInput")?.focus();
});
      
    </script>
</body>
</html>
