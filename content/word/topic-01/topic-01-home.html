        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .quick-links a {
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .landing-grid {
          grid-template-columns: 1fr;
        }
      }
