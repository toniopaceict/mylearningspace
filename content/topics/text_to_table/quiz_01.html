<!--
=========================================================
GLIP QUIZ PAGE

Help file: /help/help.html

FOR EACH NEW QUIZ, EDIT ONLY:
1. The QUIZ_CONFIG block near the top of this file.
2. The QUESTIONS array.
3. The optional EXTRA_BOX block.

DO NOT EDIT:
• The generated PAGE_CONFIG block
• Shared JavaScript references
• Shared CSS classes
• Activity IDs, subject IDs, topic IDs or level codes
• Shared page structure

The immutable activity ID is resolved automatically from the HTML filename. Subject, topic, level and activity titles are read from Google Sheets. The GLIP navigation menu remains the main guide between activities.
=========================================================
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="../../../assets/GLIP-icon-transparent.png" />

    <script>
      /*
      =====================================================
      EDIT THIS SECTION FOR EACH NEW QUIZ
      =====================================================

      NEW QUIZ CHECKLIST

      1. Rename the HTML file so that it matches the Activity Code
         in the Activities sheet, followed by .html.
      2. Update the required file links and button text if needed.
      3. Update the instructions.
      4. Update the QUESTIONS array.
      5. Update the optional EXTRA_BOX if required.
      6. Update the PDF fallback filename if required.

      Do not enter activity IDs, subject, topic, level or activity titles.
      GLIP resolves the activity from the filename and reads its metadata
      from Google Sheets.
      =====================================================
      */

      window.QUIZ_CONFIG = {
        // -------------------------------------------------
        // REQUIRED FILES
        //
        // Leave a fileLink empty to hide that button.
        // One, two or three files may be provided.
        // -------------------------------------------------
        fileLink1: "",
        fileButtonText1: "Download File",

        fileLink2: "",
        fileButtonText2: "Download File 2",

        fileLink3: "",
        fileButtonText3: "Download File 3",

        instructionsText:
          "Read each question carefully and think about both the financial meaning and the Excel function involved.",

        pdfBoxTitle:
          "Save your work as a PDF and keep a copy for future reference.",
        pdfButtonText: "Save as PDF",
        pdfFallbackName: "Quiz",
      };

      /*
      =====================================================
      QUIZ QUESTIONS

      Edit the educational content below for each quiz.
      =====================================================
      */

      window.QUESTIONS = [
        {
          id: "q1",
          title: "Q1",
          marks: 1,
          text: "In which of the following scenarios is the Present Value (PV) function most appropriately used?",
          correct: "B",
          options: [
            {
              value: "A",
              label:
                "To calculate the final amount of an investment after earning interest",
            },
            {
              value: "B",
              label:
                "To calculate how much must be invested today to reach a specific future amount",
            },
            {
              value: "C",
              label: "To calculate the annual interest rate on a loan",
            },
            {
              value: "D",
              label: "To calculate the total interest earned only",
            },
            {
              value: "E",
              label: "To calculate the monthly repayment of a loan",
            },
          ],
          fbOk: "Correct. The Present Value function is used when you know the future amount you want to receive and you need to calculate how much must be invested today to reach that target.",
          fbBad:
            "Not correct. The PV function is used to determine the amount that must be invested today in order to reach a known future value.",
        },
        {
          id: "q2",
          title: "Q2",
          marks: 3,
          text: "In 15 years’ time, you wish to have €100,000 in a bank account that pays 5% interest per year, compounded annually. How much should you invest today as a single lump sum?",
          correct: "B",
          options: [
            { value: "A", label: "€46,321" },
            { value: "B", label: "€48,102" },
            { value: "C", label: "€50,000" },
            { value: "D", label: "€52,000" },
            { value: "E", label: "€55,329" },
          ],
          fbOk: "Correct. You correctly calculated the future value back to today using the Present Value function.",
          fbBad:
            "Not correct. The correct Excel inputs are Rate = 5%, Nper = 15, Pmt = 0 because there are no additional yearly payments, Fv = 100000 and Type = 0. Excel returns a negative value because this represents money invested today.",
        },
        {
          id: "q3",
          title: "Q3",
          marks: 3,
          text: "A couple would like to give €35,000 to their children in 10 years’ time to use as a deposit on an apartment. How much should they invest today if the bank pays 4% interest per year, compounded annually?",
          correct: "A",
          options: [
            { value: "A", label: "€23,644" },
            { value: "B", label: "€24,500" },
            { value: "C", label: "€25,000" },
            { value: "D", label: "€26,700" },
            { value: "E", label: "€28,402" },
          ],
          fbOk: "Correct. You correctly applied the Present Value function to calculate how much must be invested today to reach €35,000 in 10 years.",
          fbBad:
            "Not correct. The correct Excel inputs are Rate = 4%, Nper = 10, Pmt = 0 because no additional payments are made, Fv = 35000 and Type = 0. This calculates the amount that must be invested today to reach the required future value.",
        },
      ];

      /*
      =====================================================
      OPTIONAL EXTRA INSTRUCTION BOX

      Set enabled to true when an extra box is needed before
      a particular question.
      =====================================================
      */

      window.EXTRA_BOX = {
        enabled: false,
        beforeQuestionId: "q3",
        html: `
        <fieldset class="task-box">
          <legend>Extra Instructions</legend>
          <p class="q no-print">
            For these exercises, you will need this Excel file.
          </p>
        </fieldset>
      `,
      };

      /*
      =====================================================
      END OF QUIZ-SPECIFIC SETTINGS

      Do not edit the generated configuration below.
      =====================================================
      */

      (function buildPageConfig() {
        const quiz = window.QUIZ_CONFIG;

        window.PAGE_CONFIG = {
          helpSection: "activity",
          pageKind: "quiz",

          fileLink1: quiz.fileLink1,
          fileButtonText1: quiz.fileButtonText1,
          fileLink2: quiz.fileLink2,
          fileButtonText2: quiz.fileButtonText2,
          fileLink3: quiz.fileLink3,
          fileButtonText3: quiz.fileButtonText3,

          instructionsText: quiz.instructionsText,
          pdfBoxTitle: quiz.pdfBoxTitle,
          pdfButtonText: quiz.pdfButtonText,
          pdfFallbackName: quiz.pdfFallbackName,

          get webAppUrl() {
            return typeof window.getGlipWebAppUrl === "function"
              ? window.getGlipWebAppUrl()
              : "";
          },
        };
      })();
    </script>

    <!--
    Loads shared GLIP functionality, including:
    • header and footer
    • themes and display settings
    • role handling
    • navigation
    • activity context
    • quiz rendering and marking
    • PDF export
    • lightbox support
    -->
    <script src="https://toniopaceict.github.io/mylearningspace/js/site-loader.js"></script>
  </head>

  <body>
    <div id="header-placeholder"></div>

    <div class="page-shell">
      <!--
      =====================================================
      SECTION 1: QUIZ HERO

      Displays the subject, topic and activity title.
      Values are inserted automatically from Google Sheets.
      =====================================================
      -->
      <header class="page-hero">
        <div class="page-hero-panel">
          <div class="page-hero-divider-top"></div>

          <img
            class="page-hero-brand-icon"
            src="../../../assets/GLIP-icon-transparent-cropped.png"
            alt="GLIP logo"
          />

          <div class="page-hero-logo">GLIP</div>

          <p class="page-hero-topline" id="heroTopline"></p>
          <h1 id="heroMainTitle"></h1>
          <h2 id="heroSubTitle"></h2>

          <div class="page-hero-divider-bottom"></div>
        </div>
      </header>

      <div class="top-user-bar">
        <span id="loggedInInfoTop"></span>
        <button id="logoutBtnTop" class="glip-btn" type="button" style="display: none">
          Log out
        </button>
      </div>

      <main class="wrap" id="mainContent">
        <div class="top-actions no-print">
          <button type="button" class="glip-btn" id="resetBtnTop">
            Reset Quiz
          </button>
        </div>

        <!--
        ===================================================
        SECTION 2: REQUIRED FILES

        EDIT THE FILE LINKS AND BUTTON TEXT IN QUIZ_CONFIG.

        The complete fieldset is hidden automatically when
        no required file has been configured.
        ===================================================
        -->
        <fieldset
          class="download-box no-print readable-section"
          id="requiredFilesSection"
        >
          <legend id="requiredFilesLegend">Required Files</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the required file instructions aloud"
          >
            🔊
          </button>

          <p class="q" data-read>
            Download the required file before starting this quiz.
          </p>

          <div class="download-buttons">
            <a class="glip-btn download-btn" id="fileLinkBtn1" href="#" target="glipDownloadFrame" style="display: none"></a>
            <a class="glip-btn download-btn" id="fileLinkBtn2" href="#" target="glipDownloadFrame" style="display: none"></a>
            <a class="glip-btn download-btn" id="fileLinkBtn3" href="#" target="glipDownloadFrame" style="display: none"></a>

            <iframe
              name="glipDownloadFrame"
              id="glipDownloadFrame"
              title="File download"
              hidden
            ></iframe>
          </div>

          <div
            id="downloadProgressBar"
            class="glip-loading"
            role="progressbar"
            aria-label="Preparing the file download"
          >
            <div class="glip-loading-fill"></div>
          </div>

          <p
            id="downloadMessage"
            class="panel-message text-center"
            role="status"
            aria-live="polite"
          ></p>
        </fieldset>

        <fieldset class="task-box readable-section">
          <legend>Instructions</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the quiz instructions aloud"
          >
            🔊
          </button>

          <p class="q no-print" id="instructionsText" data-read></p>
        </fieldset>

        <form id="quiz" novalidate>
          <div id="quizContainer"></div>
        </form>

        <fieldset class="tracker-box no-print readable-section">
          <legend>Save as PDF</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the PDF instructions aloud"
          >
            🔊
          </button>

          <div class="quiz-topbar">
            <div class="quiz-topbar-inner">
              <p class="q" id="pdfBoxTitle" data-read></p>

              <div class="quiz-top-actions">
                <p class="tracker-score" id="scoreBox" aria-live="polite">
                  Score: 0 / 0
                </p>

                <button type="button" class="glip-btn" id="savePdfBtn"></button>
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset class="tracker-box no-print readable-section">
          <legend>Submit</legend>

          <button
            type="button"
            class="speak-btn"
            onclick="speakSection(this)"
            aria-label="Read the submission instructions aloud"
          >
            🔊
          </button>

          <p class="q" data-read>
            Submit your quiz results to your teacher and mark this quiz as complete.
          </p>

          <div class="tracker-row">
            <button id="submitQuizResultBtn" type="button" class="glip-btn">
              Submit and Mark as Complete
            </button>
          </div>

          <div
            id="saveProgressBar"
            class="glip-loading"
            role="progressbar"
            aria-label="Saving quiz result"
          >
            <div class="glip-loading-fill"></div>
          </div>

          <p
            id="message"
            class="panel-message text-center"
            role="status"
            aria-live="polite"
          ></p>
        </fieldset>
      </main>

      <div class="site-footer" id="siteFooter"></div>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <div id="lightboxBox" class="lightbox-box">
        <div id="lightboxHeader" class="lightbox-header">
          <span class="lightbox-title">Image Preview</span>
          <button type="button" class="lightbox-close" aria-label="Close">
            ×
          </button>
        </div>

        <div class="lightbox-body">
          <img
            class="lightbox-img"
            id="lightboxImg"
            alt="Expanded question image"
          />
        </div>
      </div>
    </div>

    <script>
      /*
      =====================================================
      REQUIRED FILE INITIALISATION
      =====================================================
      */
      (function () {
        function initialiseRequiredFiles() {
          const quiz = window.QUIZ_CONFIG || {};
          const files = [
            { buttonId: "fileLinkBtn1", link: quiz.fileLink1, text: quiz.fileButtonText1 },
            { buttonId: "fileLinkBtn2", link: quiz.fileLink2, text: quiz.fileButtonText2 },
            { buttonId: "fileLinkBtn3", link: quiz.fileLink3, text: quiz.fileButtonText3 },
          ];

          let visibleFileCount = 0;

          files.forEach(function (file) {
            const button = document.getElementById(file.buttonId);
            if (!button) return;

            if (file.link) {
              button.href = file.link;
              button.textContent = file.text || "Download required file";
              button.style.display = "inline-flex";
              visibleFileCount += 1;
            } else {
              button.removeAttribute("href");
              button.style.display = "none";
            }
          });

          const section = document.getElementById("requiredFilesSection");
          const legend = document.getElementById("requiredFilesLegend");

          if (section) {
            section.style.display = visibleFileCount > 0 ? "" : "none";
          }

          if (legend) {
            legend.textContent =
              visibleFileCount === 1 ? "Required File" : "Required Files";
          }

          const progressBar = document.getElementById("downloadProgressBar");
          const message = document.getElementById("downloadMessage");

          document
            .querySelectorAll("#requiredFilesSection .download-btn")
            .forEach(function (button) {
              if (button.dataset.downloadReady) return;
              button.dataset.downloadReady = "true";

              button.addEventListener("click", function () {
                if (progressBar) progressBar.classList.add("show");
                if (message) {
                  message.textContent = "Preparing download...";
                  message.className = "panel-message text-center info";
                }

                window.setTimeout(function () {
                  if (progressBar) progressBar.classList.remove("show");
                  if (message) message.textContent = "";
                }, 3000);
              });
            });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initialiseRequiredFiles);
        } else {
          initialiseRequiredFiles();
        }

        document.addEventListener("glipReady", initialiseRequiredFiles);
        document.addEventListener("glipTopicContextRefreshed", initialiseRequiredFiles);
      })();
    </script>

    <script>
      /*
      =====================================================
      QUIZ RESULT SUBMISSION

      The activity metadata is resolved automatically by
      topic-page-context.js before this handler is used.
      =====================================================
      */
      (function () {
        function getQuizAnswer(questionId) {
          const selected = document.querySelector(
            `input[name="${questionId}"]:checked`
          );

          return selected ? selected.value : "";
        }

        function calculateQuizResult() {
          const questions = window.QUESTIONS || [];

          let score = 0;
          let totalMarks = 0;

          const answers = questions.map(function (question) {
            const selectedAnswer = getQuizAnswer(question.id);
            const marks = Number(question.marks || 1);
            const isCorrect = selectedAnswer === question.correct;

            totalMarks += marks;

            if (isCorrect) {
              score += marks;
            }

            return {
              question_id: question.id,
              question_title: question.title,
              selected_answer: selectedAnswer,
              correct_answer: question.correct,
              marks: marks,
              awarded_marks: isCorrect ? marks : 0,
              is_correct: isCorrect,
            };
          });

          const percentage =
            totalMarks > 0 ? Math.round((score / totalMarks) * 100) : 0;

          return {
            score: score,
            totalMarks: totalMarks,
            percentage: percentage,
            answers: answers,
          };
        }

        function allQuizQuestionsAnswered(result) {
          return result.answers.every(function (answer) {
            return answer.selected_answer;
          });
        }

        function setQuizSavingState(isSaving) {
          const button = document.getElementById("submitQuizResultBtn");
          const progressBar = document.getElementById("saveProgressBar");

          if (button) {
            button.disabled = isSaving;
            button.textContent = isSaving
              ? "Saving..."
              : "Submit and Mark as Complete";
          }

          if (progressBar) {
            progressBar.classList.toggle("show", isSaving);
          }
        }

        function setMessage(text, type) {
          const message = document.getElementById("message");
          if (!message) return;

          message.textContent = text || "";
          message.className =
            "panel-message text-center" + (type ? " " + type : "");
        }

        function updateMenuIconAfterQuizSubmit() {
          const config = window.PAGE_CONFIG || {};

          window.dispatchEvent(
            new CustomEvent("glipProgressSaved", {
              detail: {
                activityId: config.activityId,
                status: "completed",
                subjectId: config.subjectId,
                level: config.level,
                topicId: config.topicId,
              },
            })
          );
        }

        function submitQuizResult() {
          const config = window.PAGE_CONFIG || {};
          const result = calculateQuizResult();

          if (!allQuizQuestionsAnswered(result)) {
            setMessage(
              "Please answer all quiz questions before submitting.",
              "error"
            );
            return;
          }

          const studentId = sessionStorage.getItem("glipStudentId") || "";

          if (!studentId) {
            setMessage("Student not logged in.", "error");
            return;
          }

          const webAppUrl =
            typeof window.getGlipWebAppUrl === "function"
              ? window.getGlipWebAppUrl()
              : config.webAppUrl || "";

          if (!webAppUrl) {
            setMessage("GLIP could not connect to the server.", "error");
            return;
          }

          setQuizSavingState(true);
          setMessage("Saving quiz result...", "info");

          fetch(webAppUrl, {
            method: "POST",
            body: JSON.stringify({
              action: "saveQuizResultAndProgress",

              student_id: studentId,
              student_name: sessionStorage.getItem("glipStudentName") || "",
              class_id: sessionStorage.getItem("glipClassId") || "",

              level: config.level,
              subject_id: config.subjectId,
              topic_id: config.topicId,
              topic_name: config.topicName,
              activity_id: config.activityId,
              quiz_title:
                config.subTitle ||
                config.pdfFallbackName ||
                "Quiz",

              score: result.score,
              total_marks: result.totalMarks,
              percentage: result.percentage,
              answers_json: JSON.stringify(result.answers),
            }),
          })
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              if (data.status !== "success") {
                throw new Error(data.message || "Could not save quiz result.");
              }

              updateMenuIconAfterQuizSubmit();

              setMessage(
                "Your quiz has been submitted and marked as complete.",
                "success"
              );
            })
            .catch(function (error) {
              setMessage(
                error.message || "Could not save quiz result.",
                "error"
              );
            })
            .finally(function () {
              setQuizSavingState(false);
            });
        }

        function initialiseQuizSubmission() {
          const button = document.getElementById("submitQuizResultBtn");

          if (button && !button.dataset.quizSubmitReady) {
            button.dataset.quizSubmitReady = "true";
            button.addEventListener("click", submitQuizResult);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener(
            "DOMContentLoaded",
            initialiseQuizSubmission
          );
        } else {
          initialiseQuizSubmission();
        }

        document.addEventListener(
          "glipReady",
          initialiseQuizSubmission
        );
      })();
    </script>
  </body>
</html>
